        }
        setBossFeedback(message, "good");
        eventPulse("hit");
        playTone("hit");
      } else {
        bossRun.phaseAttempts.add(value);
        setBossFeedback(`かけ算をもう一度。<strong>${bossRun.phase === "multiply-ones" ? bossRun.b % 10 : Math.floor(bossRun.b / 10)}×${q}</strong>${bossRun.phase === "multiply-tens" ? `に${carry}を足す` : ""}。`, "try");
        eventPulse("miss");
      }
    }

    function chooseBossVerdict(value) {
      if (bossRun.phase !== "compare" || bossRun.phaseReady || bossRun.phaseAttempts.has(value)) return;
      const step = bossStep();
      const product = bossRun.b * bossRun.candidate;
      const verdict = bossVerdict(step);
      if (value === verdict) {
        bossRun.phaseReady = true;
        bossRun.phaseAnswer = value;
        bossRun.candidateVerified = verdict === "fit";
        if (verdict === "over") {
          bossRun.attemptedQs.add(bossRun.candidate);
          bossRun.retryReason = `${product}は${step.partial}をこえた。`;
          setBossFeedback(`<strong>大きすぎる。</strong> 商を${bossRun.candidate}より小さくしよう。`, "good");
        } else if (verdict === "under") {
          const remainder = step.partial - product;
          bossRun.attemptedQs.add(bossRun.candidate);
          bossRun.retryReason = `余り${remainder}に${bossRun.b}がもう1つ入る。`;
          setBossFeedback(`<strong>もう1つ入る。</strong> 余り${remainder}は${bossRun.b}以上。商を${bossRun.candidate}より大きくしよう。`, "good");
        } else {
          const remainder = step.partial - product;
          setBossFeedback(`<strong>もう入らない。</strong> 余り${remainder}は${bossRun.b}より小さい。商は${bossRun.candidate}で確定。`, "good");
        }
        eventPulse("hit");
        playTone("hit");
      } else {
        bossRun.phaseAttempts.add(value);
        const remainder = step.partial - product;
        const label = product > step.partial
          ? `積<strong>${product}</strong>と上の数<strong>${step.partial}</strong>を見比べよう。`
          : `筆算で出した余り<strong>${remainder}</strong>と、割る数<strong>${bossRun.b}</strong>を見比べよう。`;
        setBossFeedback(label, "try");
        eventPulse("miss");
      }
    }

    function chooseBossBorrow() {
      if (bossRun.phase !== "subtract" || bossRun.phaseReady || !bossRun.subtraction || bossRun.subtraction.action !== "borrow") return;
      const subtraction = bossRun.subtraction;
      const current = subtraction.steps[subtraction.index];
      const original = current.minuend - 10;
      bossRun.phaseReady = true;
      bossRun.phaseAnswer = "borrow";
      setBossFeedback(`左の位から<strong>1</strong>をかりた。${original}は<strong>${current.minuend}</strong>になった。次はこの2つをひこう。`, "good");
      eventPulse("hint");
      playTone("hit");
    }

    function chooseBossSubtraction(value) {
      if (bossRun.phase !== "subtract" || bossRun.phaseReady || !bossRun.subtraction || bossRun.subtraction.action !== "digit" || bossRun.phaseAttempts.has(value)) return;
      const subtraction = bossRun.subtraction;
      const current = subtraction.steps[subtraction.index];
      const place = subtractionPlaceName(current.column, subtraction.width);
      if (value === current.result) {
        subtraction.results[current.column] = value;
        bossRun.phaseReady = true;
        bossRun.phaseAnswer = value;
        const last = subtraction.index === subtraction.steps.length - 1;
        setBossFeedback(`<strong>${current.minuend}−${current.subtrahend}=${current.result}</strong>。${place}に${current.result}を書く。${last ? "引き算がつながった。" : "次は左の位へ。"}`, "good");
        eventPulse("hit");
        playTone("hit");
      } else {
        bossRun.phaseAttempts.add(value);
        setBossFeedback(`${place}だけを見る。青い<strong>${current.minuend}</strong>から、黄色い<strong>${current.subtrahend}</strong>をひこう。`, "try");
        eventPulse("miss");
      }
    }

    function chooseBossBringDown() {
      if (bossRun.phase !== "bring" || bossRun.phaseReady) return;
      const step = bossStep();
      const nextPartial = step.remainder * 10 + step.nextDigit;
      bossRun.phaseReady = true;
      bossRun.phaseAnswer = nextPartial;
      setBossFeedback(`<strong>${step.remainder}</strong>の右に<strong>${step.nextDigit}</strong>をおろして、次に見る数は<strong>${nextPartial}</strong>。`, "good");
      eventPulse("hint");
      playTone("hit");
    }

    function beginBossPhase(phase) {
      if (bossAutoTimer !== null) {
        window.clearTimeout(bossAutoTimer);
        bossAutoTimer = null;
      }
      bossRun.phase = phase;
      if (phase === "subtract") {
        const step = bossStep();
        bossRun.subtraction = buildSubtractionPlan(step.partial, bossRun.b * bossRun.candidate);
      }
      if (phase === "estimate") bossRun.subtraction = null;
      bossRun.phaseReady = false;
      bossRun.phaseAnswer = null;
      bossRun.phaseAttempts = new Set();
      bossRun.feedbackKind = "";
      hintLevel = 0;
      $("hintbox").classList.remove("show");
      $("hintbox").innerHTML = "";
      $("hint").textContent = "ヒント 0/3";

      const prompts = {
        estimate: bossRun.retryReason ? "方向は分かった。新しい商を選ぼう。" : "概数から、まず仮の商を決めよう。",
        "multiply-ones": "割る数の一の位から、商をかける。",
        "multiply-tens": "小さく置いた数を忘れずに足す。",
        compare: bossVerdict(bossStep()) === "over" ? "積が上の数をこえていないか確かめる。" : "引き算の余りに、割る数がもう1つ入るか確かめる。",
        subtract: "右の一の位から、積を1桁ずつひく。",
        bring: "余りの右に、次の桁をおろす。"
      };
      bossRun.feedback = prompts[phase] || "筆算を続けよう。";
      renderBossPhase();
    }

    function completeBossDigit() {
      const step = bossStep();
      const nextPartial = step.nextDigit === null ? null : step.remainder * 10 + step.nextDigit;
      bossRun.completedDigits[step.digitIndex] = step.quotientDigit;
      bossRun.history.push({ ...step, nextPartial });
      state.boss.progress += 1;

      if (bossRun.stepIndex >= bossRun.steps.length - 1) {
        state.boss.defeated = true;
        bossRun.phase = "done";
        bossRun.phaseReady = false;
        bossRun.feedback = `<strong>${bossRun.a}÷${bossRun.b}=${bossRun.quotient}</strong>${bossRun.remainder ? `、余り${bossRun.remainder}` : "。余りなし"}。`;
        bossRun.feedbackKind = "good";
        renderBossPhase();
        renderEnemy("victory");
        say(enemies.boss.win);
        eventPulse("win");
        burst(24, "win");
        playTone("win");
        window.setTimeout(() => {
          if (mode === "boss" && state.boss.defeated) showFinish();
        }, 1150);
        return;
      }

      bossRun.stepIndex += 1;
      bossRun.candidate = null;
      bossRun.candidateVerified = false;
      bossRun.retryReason = "";
      bossRun.subtraction = null;
      bossRun.attemptedQs = new Set();
      renderEnemy("hit");
      say(enemies.boss.hits[Math.min(state.boss.progress - 1, enemies.boss.hits.length - 1)]);
      eventPulse("hit");
      burst(10, "hit");
      playTone("hit");
      beginBossPhase("estimate");
    }

    function bossNext() {
      if (!bossRun || !bossRun.phaseReady) return;
      if (bossRun.phase === "place") return beginBossPhase("estimate");
      if (bossRun.phase === "estimate") return beginBossPhase("multiply-ones");
      if (bossRun.phase === "multiply-ones") return beginBossPhase("multiply-tens");
      if (bossRun.phase === "multiply-tens") return bossVerdict(bossStep()) === "over" ? beginBossPhase("compare") : beginBossPhase("subtract");
      if (bossRun.phase === "compare") {
        if (bossRun.candidateVerified) {
          if (bossStep().nextDigit !== null) return beginBossPhase("bring");
          return completeBossDigit();
        }
        bossRun.candidate = null;
        return beginBossPhase("estimate");
      }
      if (bossRun.phase === "subtract") {
        const subtraction = bossRun.subtraction;
        if (subtraction.action === "borrow") {
          subtraction.action = "digit";
          bossRun.phaseReady = false;
          bossRun.phaseAnswer = null;
          bossRun.phaseAttempts = new Set();
          bossRun.feedback = "借りたあとの数字で、同じ位をひこう。";
          bossRun.feedbackKind = "";
          hintLevel = 0;
          $("hintbox").classList.remove("show");
          $("hintbox").innerHTML = "";
          $("hint").textContent = "ヒント 0/3";
          renderBossPhase();
          return;
        }
        if (subtraction.index < subtraction.steps.length - 1) {
          subtraction.index += 1;
          subtraction.action = subtraction.steps[subtraction.index].borrowed ? "borrow" : "digit";
          bossRun.phaseReady = false;
          bossRun.phaseAnswer = null;
          bossRun.phaseAttempts = new Set();
          bossRun.feedback = subtraction.action === "borrow" ? "そのまま引けるか、右から順に見よう。" : "1つ左の位へ進もう。";
          bossRun.feedbackKind = "";
          hintLevel = 0;
          $("hintbox").classList.remove("show");
          $("hintbox").innerHTML = "";
          $("hint").textContent = "ヒント 0/3";
          renderBossPhase();
          return;
        }
        const written = Number(subtraction.results.join(""));
        const trialRemainder = bossStep().partial - bossRun.b * bossRun.candidate;
        if (written !== trialRemainder) return;
        return beginBossPhase("compare");
      }
      if (bossRun.phase === "bring") return completeBossDigit();
    }

    function bossHint() {
      if (!bossRun || bossRun.phaseReady || state.boss.defeated) return;
      hintLevel = Math.min(3, hintLevel + 1);
      $("hint").textContent = `ヒント ${hintLevel}/3`;
      $("hintbox").classList.add("show");
      const step = bossStep();
      const q = bossRun.candidate;
      const verdict = q === null ? "" : bossVerdict(step, q);
      const compareProduct = q === null ? 0 : bossRun.b * q;
      const compareRemainder = step.partial - compareProduct;
      const subtraction = bossRun.subtraction;
      const subtractionStep = subtraction ? subtraction.steps[subtraction.index] : null;
      const subtractionHints = subtractionStep
        ? subtraction.action === "borrow"
          ? [
              `<strong>${subtractionStep.minuend - 10}</strong>から<strong>${subtractionStep.subtrahend}</strong>は、そのままでは引けない。`,
              `左の位から<strong>1</strong>をかりる。上の筆算で黄色く光る位を見よう。`,
              `<strong>${subtractionStep.minuend - 10}</strong>は<strong>${subtractionStep.minuend}</strong>になる。「1をかりる」を押そう。`
            ]
          : [
              `今は<strong>${subtractionPlaceName(subtractionStep.column, subtraction.width)}</strong>だけを見る。`,
              `青い<strong>${subtractionStep.minuend}</strong>から、黄色い<strong>${subtractionStep.subtrahend}</strong>をひく。`,
              `答えは<strong>${subtractionStep.result}</strong>。同じ位に書く。`
            ]
        : ["右の位から順にひこう。"];
      const compareHints = verdict === "over"
        ? [
            `積<strong>${compareProduct}</strong>は、上の数<strong>${step.partial}</strong>より大きい。`,
            `大きい数はここでは引けないので、商を小さくする。`,
            `答えは<strong>「積が大きい」</strong>。`
          ]
        : [
            `上の筆算で、<strong>${step.partial}−${compareProduct}=${compareRemainder}</strong>になった。`,
            `余り<strong>${compareRemainder}</strong>と、割る数<strong>${bossRun.b}</strong>を比べる。`,
            verdict === "under" ? `余りに${bossRun.b}が<strong>もう1つ入る</strong>。` : `余りは${bossRun.b}より小さいので<strong>もう入らない</strong>。`
          ];
      const hints = {
        place: [
          `左から<strong>${bossRun.b}以上</strong>になるまで、見る桁を増やす。`,
          `${bossRun.digits.slice(0, step.digitIndex).join("") || bossRun.digits[0]}では足りない。<strong>${step.partial}</strong>まで見る。`,
          `最初の商は<strong>${placeName(step.digitIndex, bossRun.digits.length)}</strong>に立つ。`
        ],
        estimate: [
          `<strong>${step.partial}→${step.roundedDividend}</strong>、<strong>${bossRun.b}→${step.roundedDivisor}</strong>で見る。`,
          `<strong>${step.roundedDividend}÷${step.roundedDivisor}</strong>を考える。予想なので、あとで直してよい。`,
          `まず<strong>${step.estimate}</strong>個くらいと予想してみよう。`
        ],
        "multiply-ones": [
          `割る数${bossRun.b}の一の位は<strong>${bossRun.b % 10}</strong>。`,
          `<strong>${bossRun.b % 10}×${q}</strong>を計算する。`,
          `答えは<strong>${(bossRun.b % 10) * q}</strong>。一の位を書き、残りは小さく上へ。`
        ],
        "multiply-tens": [
          `十の位<strong>${Math.floor(bossRun.b / 10)}</strong>に商<strong>${q}</strong>をかける。`,
          `そこへ、さっきのくり上がり<strong>${Math.floor(((bossRun.b % 10) * q) / 10)}</strong>を足す。`,
          `答えは<strong>${Math.floor(bossRun.b / 10) * q + Math.floor(((bossRun.b % 10) * q) / 10)}</strong>。積は${bossRun.b * q}。`
        ],
        compare: compareHints,
        subtract: subtractionHints,
        bring: [
          `次の桁は<strong>${step.nextDigit}</strong>。`,
          `余り<strong>${step.remainder}</strong>の右に${step.nextDigit}を置く。`,
          `次に見る数は<strong>${step.remainder * 10 + step.nextDigit}</strong>。`
        ]
      };
      $("hintbox").innerHTML = `ヒント${hintLevel}：${(hints[bossRun.phase] || ["筆算の順番をたどろう。"])[hintLevel - 1]}`;
      eventPulse("hint");
    }

    function renderProblem() {
      if (mode === "boss") {
        renderBossPhase();
        return;
      }
      $("choices").classList.remove("two");
      $("kicker").textContent = `成功 ${state[mode].progress}/5`;
      $("equation").className = "equation";
      if (mode === "weak") {
        $("question").textContent = "いちばん近い攻撃はどれ？";
        $("equation").innerHTML = `<span class="target-num">${problem.target}</span> くらい`;
        $("desc").textContent = "同じ数字は出ない。近さで選ぼう。";
        $("visual").innerHTML = targetStart(problem.target);
      } else if (mode === "mid") {
        $("question").textContent = "まず、商をざっくり見立てると？";
        $("equation").textContent = `${problem.a} ÷ ${problem.b}`;
        $("desc").textContent = "丸めて仮の商を決め、本当の数で確かめる。";
        $("visual").innerHTML = `<div class="estimate-start"><b>${problem.a}</b><i>÷</i><b>${problem.b}</b><small>近いキリのいい数にすると？</small></div>`;
      } else {
        $("question").textContent = "見る範囲を決めて、商を立てよう";
        $("equation").textContent = `${problem.a} ÷ ${problem.b} = ?`;
        $("desc").textContent = "左から見て、かけ算で確かめる。";
        $("visual").innerHTML = strongStartVisual(problem);
      }

      const smallLabel = mode === "weak" ? "こうげき" : mode === "mid" ? "仮の商" : "商";
      $("choices").innerHTML = problem.values.map((value) => `<button class="choice" type="button" data-value="${value}" aria-label="${value}を選ぶ">${value}<small>${smallLabel}</small></button>`).join("");
      document.querySelectorAll(".choice").forEach((button) => button.addEventListener("click", () => answer(Number(button.dataset.value), button)));
    }

    function resetRoundUi() {
      hintLevel = 0;
      solved = false;
      attempted = new Set();
      roundingGuide = null;
      placeGuide = null;
      $("hintbox").classList.remove("show");
      $("hintbox").innerHTML = "";
      $("hint").textContent = "ヒント 0/3";
      $("hint").disabled = false;
      $("next").disabled = true;
      $("next").textContent = "数字をえらぼう";
      $("feedback").className = "feedback";
      $("feedback").textContent = "選ぶと、数字の差や量が見える。";
    }

    function newProblem() {
      if (state[mode].defeated) {
        showFinish();
        return;
      }
      $("round").hidden = false;
      $("finish").hidden = true;
      resetRoundUi();
      problem = makeProblem();
      renderEnemy();
      say(state[mode].progress === 0 ? pick(enemies[mode].intro) : "つぎも来るの。<br>聞いてないけど。" );
      renderProblem();
    }

    function setChoicesLocked(locked) {
      document.querySelectorAll(".choice").forEach((button) => {
        button.disabled = locked || attempted.has(Number(button.dataset.value));
      });
    }

    function answer(value, button) {
      if (solved || attempted.has(value)) return;

      let correct = false;
      let message = "";

      if (mode === "weak") {
        const distance = Math.abs(value - problem.target);
        correct = value === problem.answer;
        $("visual").innerHTML = numberLine(problem.target, problem.values, value);
        message = correct
          ? `<strong>${value}</strong> は ${problem.target} まで ${distance}。いちばん近い。`
          : `<strong>${value}</strong> は ${problem.target} まで ${distance}。まだ近い数字がある。`;
      } else if (mode === "mid") {
        correct = value === problem.estimate;
        $("equation").className = "equation";
        $("equation").textContent = `${problem.a} ÷ ${problem.b}`;
        $("desc").textContent = "本当の数に戻して、かけ算で確かめる。";
        $("visual").innerHTML = midCheckVisual(problem, value);
        if (correct) {
          const product = problem.b * value;
          message = value > problem.final
            ? `<strong>見立ては ${value}。</strong> でも ${problem.b}×${value}=${product} で ${product - problem.a} こえる。だから商を ${problem.final} に1つ下げる。`
            : `<strong>見立ては ${value}。</strong> ${problem.b}×${value}=${product} は入る。次はこえるので、そのままでOK。`;
        } else {
          message = value < problem.estimate
            ? `<strong>${problem.ra}÷${problem.rb}</strong> なら、${value}個よりもう少し入りそう。`
            : `<strong>${problem.ra}÷${problem.rb}</strong> で見ると、${value}個は大きそう。`;
        }
      } else {
        const product = problem.b * value;
        correct = value === problem.answer;
        $("visual").innerHTML = quantityVisual(problem.a, problem.b, value);
        if (correct) {
          message = problem.remainder === 0
            ? `<strong>${problem.b}×${value}=${product}</strong>。ぴったり入った。`
            : `<strong>${problem.b}×${value}=${product}</strong>。${problem.a}まであと${problem.remainder}だから、${value}個入る。`;
        } else if (product > problem.a) {
          message = `<strong>${problem.b}×${value}=${product}</strong>。${problem.a}を${product - problem.a}こえた。1個へらすと？`;
        } else {
          const nextProduct = problem.b * (value + 1);
          message = `<strong>${problem.b}×${value}=${product}</strong>。まだ${problem.a - product}ある。もう1個なら${nextProduct}。`;
        }
      }

      if (correct) {
        solved = true;
        button.classList.add("good");
        setChoicesLocked(true);
        $("feedback").className = "feedback good";
        $("feedback").innerHTML = message;
        $("hint").disabled = true;
        registerHit();
      } else {
        attempted.add(value);
        button.classList.add("tried");
        button.disabled = true;
        $("feedback").className = "feedback try";
        $("feedback").innerHTML = `${message}<br>ほかの数字を選んでみよう。`;
        say(pick(enemies[mode].misses));
        renderEnemy("miss");
        eventPulse("miss");
        playTone("miss");
      }
    }

    function registerHit() {
      const solvedMode = mode;
      state[mode].progress += 1;
      if (state[mode].progress >= 5) state[mode].defeated = true;
      renderEnemy(state[mode].defeated ? "victory" : "hit");
      say(state[mode].defeated ? enemies[mode].win : enemies[mode].hits[state[mode].progress - 1]);
      eventPulse(state[mode].defeated ? "win" : "hit");
      burst(state[mode].defeated ? 20 : 9, state[mode].defeated ? "win" : "hit");
      playTone(state[mode].defeated ? "win" : "hit");

      if (state[mode].defeated) {
        $("next").disabled = true;
        $("next").textContent = "やっつけた";
        window.setTimeout(() => {
          if (mode === solvedMode && state[mode].defeated) showFinish();
        }, 850);
      } else {
        $("next").disabled = false;
        $("next").textContent = "つぎの一撃";
      }
    }

    function hint() {
      if (mode === "boss") {
        bossHint();
        return;
      }
      if (solved) return;
      hintLevel = Math.min(3, hintLevel + 1);
      $("hint").textContent = `ヒント ${hintLevel}/3`;
      $("hintbox").classList.add("show");
      eventPulse("hint");

      if (mode === "weak") {
        if (hintLevel === 1) $("hintbox").textContent = `ヒント1：${problem.target}より小さいか、大きいかを先に見る。`;
        if (hintLevel === 2) $("hintbox").textContent = `ヒント2：候補から${problem.target}まで、いくつ動くか数えてみる。`;
        if (hintLevel === 3) $("hintbox").textContent = `ヒント3：${problem.values.map((value) => `${value}は${Math.abs(value - problem.target)}はなれる`).join(" ／ ")}`;
      } else if (mode === "mid") {
        if (hintLevel === 1) {
          startRoundingGuide();
        }
        if (hintLevel === 2) {
          $("equation").innerHTML = `<span class="rounded-number">${problem.ra}</span> ÷ <span class="rounded-number">${problem.rb}</span>`;
          $("desc").textContent = `${problem.a}は${problem.ra}くらい、${problem.b}は${problem.rb}くらい。`;
          $("hintbox").innerHTML = `ヒント2：<strong>${problem.a}→${problem.ra}</strong>、<strong>${problem.b}→${problem.rb}</strong>。だいたい何個？`;
        }
        if (hintLevel === 3) {
          $("hintbox").innerHTML = `ヒント3：仮の商は <strong>${problem.estimate}</strong>。このあと本当の ${problem.b} で確かめる。`;
          $("visual").innerHTML = quantityVisual(problem.ra, problem.rb, problem.estimate, `${problem.ra} の中に ${problem.rb} を並べる`);
        }
      } else {
        if (hintLevel === 1) startPlaceGuide();
        if (hintLevel === 2) {
          $("hintbox").innerHTML = `ヒント2：候補を<strong>かけ算</strong>にして、${problem.partial}と比べよう。`;
          $("visual").innerHTML = productChoicesVisual(problem);
        }
        if (hintLevel === 3) {
          $("hintbox").innerHTML = `ヒント3：${problem.b}×${problem.answer}=${problem.b * problem.answer}。${problem.partial}をこえず、次はこえる。`;
          $("visual").innerHTML = quantityVisual(problem.a, problem.b, problem.answer);
        }
      }
    }

    function showFinish() {
      $("round").hidden = true;
      $("finish").hidden = false;
      $("finishStamp").textContent = enemies[mode].stamp;
      $("finishTitle").textContent = enemies[mode].name;
      if (mode === "boss" && bossRun) {
        const remainderText = bossRun.remainder ? `、余り ${bossRun.remainder}` : "、余りなし";
        $("finishText").innerHTML = `<strong>${bossRun.a} ÷ ${bossRun.b} = ${bossRun.quotient}${remainderText}</strong><br>${enemies.boss.finish}`;
        $("replay").textContent = "次のボス";
        $("nextEnemy").textContent = "最初の敵へ";
      } else {
        $("finishText").textContent = enemies[mode].finish;
        $("replay").textContent = "もう一回";
        $("nextEnemy").textContent = "つぎの敵へ";
      }
      renderEnemy("victory");
      say(enemies[mode].win);
    }

    function restartMode() {
      state[mode] = { progress: 0, defeated: false };
      if (mode === "boss") bossRun = null;
      newProblem();
    }

    function moveToNextEnemy() {
      const nextMode = modeOrder[(modeOrder.indexOf(mode) + 1) % modeOrder.length];
      switchMode(nextMode);
    }

    function switchMode(nextMode) {
      mode = nextMode;
      $("app").dataset.mode = mode;
      if (state[mode].defeated) showFinish();
      else if (mode === "boss" && bossRun) {
        solved = false;
        $("round").hidden = false;
        $("finish").hidden = true;
        problem = bossRun;
        renderEnemy();
        renderBossPhase();
      } else newProblem();
    }

    function burst(count, kind = "hit") {
      const colors = kind === "win"
        ? ["var(--main)", "var(--accent)", "var(--event-win)", "var(--event-hint)", "var(--paper)"]
        : ["var(--main)", "var(--main)", "var(--accent)", "var(--paper)"];
      $("particles").innerHTML = Array.from({ length: count }, (_, index) => {
        const angle = (Math.PI * 2 * index) / count;
        const distance = rnd(55, 130);
        return `<i class="particle" style="--x:${rnd(38, 62)}%;--y:${rnd(26, 43)}%;--dx:${Math.cos(angle) * distance}px;--dy:${Math.sin(angle) * distance}px;--delay:${index * 8}ms;--c:${colors[index % colors.length]}"></i>`;
      }).join("");
      window.setTimeout(() => { $("particles").innerHTML = ""; }, 1100);
    }

    function playTone(kind) {
      if (!soundOn) return;
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (!AudioContext) return;
      const context = playTone.context || (playTone.context = new AudioContext());
      const notes = kind === "win" ? [392, 523, 659] : kind === "hit" ? [330, 494] : [180];
      notes.forEach((frequency, index) => {
        const oscillator = context.createOscillator();
        const gain = context.createGain();
        oscillator.type = kind === "miss" ? "square" : "triangle";
        oscillator.frequency.value = frequency;
        gain.gain.setValueAtTime(.0001, context.currentTime + index * .08);
        gain.gain.exponentialRampToValueAtTime(.07, context.currentTime + index * .08 + .01);
        gain.gain.exponentialRampToValueAtTime(.0001, context.currentTime + index * .08 + .13);
        oscillator.connect(gain).connect(context.destination);
        oscillator.start(context.currentTime + index * .08);
        oscillator.stop(context.currentTime + index * .08 + .15);
      });
    }

    $("visual").addEventListener("click", (event) => {
      const placeButton = event.target.closest?.("[data-place]");
      if (!placeButton || !$("visual").contains(placeButton)) return;
      chooseBossPlace(Number(placeButton.dataset.place));
    });
    document.querySelectorAll(".mode-tab").forEach((tab) => tab.addEventListener("click", () => switchMode(tab.dataset.mode)));
    $("hint").addEventListener("click", hint);
    $("next").addEventListener("click", () => {
      if (mode === "boss") bossNext();
      else if (solved && !state[mode].defeated) newProblem();
    });
    $("replay").addEventListener("click", restartMode);
    $("nextEnemy").addEventListener("click", moveToNextEnemy);
    $("sound").addEventListener("click", () => {
      soundOn = !soundOn;
      $("sound").textContent = soundOn ? "音 ON" : "音 OFF";
      $("sound").setAttribute("aria-pressed", String(soundOn));
      if (soundOn) playTone("hit");
    });

    newProblem();
  </script>
</body>
</html>
