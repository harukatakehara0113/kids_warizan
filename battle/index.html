<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>ギリギリバトル v0.3</title><style>
:root{--g:#82c46c;--gd:#4b8f49;--y:#f4d74d;--r:#f26b64;--ink:#111;--paper:#fffdf8;--blue:#a8c9dd}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:#edf5e8;color:#111;font-family:"Hiragino Sans","Yu Gothic",system-ui,sans-serif}button{font:inherit;color:inherit}.app{width:min(430px,100vw);min-height:100dvh;margin:auto;padding:8px 9px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(#dff0d6,#c6e6b7)}.head{text-align:center}.title{display:inline-block;background:var(--y);border:3px solid #111;border-radius:14px;padding:4px 12px 7px;font-size:28px;font-weight:900;letter-spacing:-2px;transform:rotate(-2deg)}.sub{font-size:12px;font-weight:900;margin:2px}.tabs,.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:6px 0}.tab,.choice,.btn{border:3px solid #111;background:#fff;border-radius:13px;font-weight:900}.tab{padding:7px 2px}.tab.on,.btn.main{background:var(--y)}
.arena{border:3px solid #111;border-radius:17px;background:var(--g);padding:8px;display:grid;grid-template-columns:1fr 120px;gap:7px;align-items:center}.badge{display:inline-block;background:#fff;border:2px solid #111;border-radius:99px;padding:2px 7px;font-size:11px;font-weight:900}.talk{background:#fff;border:3px solid #111;border-radius:13px;padding:7px 9px;font-size:13px;font-weight:900;line-height:1.25;margin-top:5px;min-height:50px}.ename{font-size:11px;font-weight:900;margin-top:3px;text-align:center}
.character{height:92px;position:relative;display:flex;align-items:center;justify-content:center}.body{width:82px;height:66px;background:#fff;border:4px solid #111;border-radius:15px;position:relative;display:flex;align-items:center;justify-content:center;font-size:31px;font-weight:900}.eye{position:absolute;top:20px;width:7px;height:7px;background:#111;border-radius:50%}.e1{left:22px}.e2{right:22px}.mouth{position:absolute;bottom:13px;width:19px;border-top:4px solid #111}.arm{position:absolute;width:27px;border-top:4px solid #111;top:49px}.al{left:2px;transform:rotate(22deg)}.ar{right:2px;transform:rotate(-22deg)}.leg{position:absolute;height:23px;border-left:4px solid #111;top:70px}.l1{left:43px;transform:rotate(12deg)}.l2{right:43px;transform:rotate(-12deg)}.shirt .body{background:#d8e9e0}.book .body{background:#f5e6a5;width:86px}.tablet .body{background:#c7c7c7;height:72px}.tablet .body:before{content:"🔒";font-size:25px}.shirt .body:before{content:"T";font-size:28px}.book .body:before{content:"宿";font-size:27px}.game{background:var(--paper);border:3px solid #111;border-radius:16px;padding:9px;margin-top:6px}.question{text-align:center;font-size:14px;font-weight:900}.equation{text-align:center;font-size:30px;font-weight:900;margin:2px}.desc{text-align:center;font-size:12px;font-weight:800;color:#444;min-height:30px}.visual{min-height:78px;border:2px dashed #777;border-radius:12px;margin:7px 0;padding:7px;background:#fff}.meter{height:25px;border:3px solid #111;border-radius:8px;overflow:hidden;display:flex}.chunk{height:100%;background:var(--y);border-right:2px solid #111;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:900}.rest{height:100%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:900}.numberline{position:relative;height:48px;border-bottom:4px solid #111;margin:2px 8px}.mark{position:absolute;bottom:-9px;transform:translateX(-50%);font-size:11px;font-weight:900;text-align:center}.mark:before{content:"";display:block;height:15px;border-left:3px solid #111;margin:auto}.target{font-size:20px;color:var(--r)}.choice{padding:8px 3px;min-height:64px;font-size:25px}.choice small{display:block;font-size:10px}.hintbox{display:none;background:#e9f3f8;border:3px solid #111;border-radius:13px;padding:7px;margin-top:6px;font-size:13px;font-weight:900;text-align:center}.hintbox.show{display:block}.feedback{min-height:40px;border:3px solid #111;border-radius:13px;background:#f2f2f2;padding:7px 9px;font-size:12px;font-weight:900;margin-top:6px}.buttons{display:flex;gap:6px;margin-top:6px}.btn{flex:1;padding:8px;font-size:13px}.btn.hint{background:var(--blue)}
@keyframes hit{25%{transform:translateX(-5px) rotate(-3deg)}50%{transform:translateX(5px) rotate(3deg)}75%{transform:translateX(-3px)}}.hit{animation:hit .35s}.resultGood{background:#fff1a9}.resultBad{background:#ffd2cf}
</style></head><body><main class="app"><div class="head"><div class="title">ギリギリバトル</div><div class="sub">数字の感覚で、日常のこまりごとを倒せ。</div></div>
<div class="tabs"><button class="tab on" data-mode="weak">弱：近さ</button><button class="tab" data-mode="mid">中：見立て</button><button class="tab" data-mode="strong">強：商</button></div>
<section class="arena"><div><span class="badge" id="badge"></span><div class="talk" id="talk"></div></div><div><div class="character" id="char"></div><div class="ename" id="ename"></div></div></section>
<section class="game"><div class="question" id="question"></div><div class="equation" id="equation"></div><div class="desc" id="desc"></div><div class="visual" id="visual"></div><div class="choices" id="choices"></div><div class="hintbox" id="hintbox"></div></section>
<div class="feedback" id="feedback"></div><div class="buttons"><button class="btn hint" id="hint">ヒント</button><button class="btn main" id="next">つぎのお題</button></div></main>
<script>
const $=x=>document.getElementById(x), rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;let mode="weak",problem,hintLevel=0,locked=false;
const enemies={weak:{name:"まだ湿ってるTシャツ",kind:"shirt",talk:"乾いたつもりです。<br>たぶん。"},mid:{name:"終わらない宿題プリント",kind:"book",talk:"だいたいで考える？<br>そういうの困るんだけど。"},strong:{name:"親に替えられたパスワード",kind:"tablet",talk:"何回入るか分かっても、<br>パスワードは教えません。"}};
function character(){let e=enemies[mode];$("char").className="character "+e.kind;$("char").innerHTML='<span class="arm al"></span><span class="arm ar"></span><div class="body"><i class="eye e1"></i><i class="eye e2"></i><i class="mouth"></i></div><i class="leg l1"></i><i class="leg l2"></i>';$("ename").textContent=e.name;$("talk").innerHTML=e.talk;$("badge").textContent=mode==="weak"?"近さを感じろ":mode==="mid"?"ざっくり見立てろ":"商を見抜け"}
function uniq(a){return [...new Set(a)]}
function makeWeak(){let t=rnd(18,68),ds=uniq([rnd(1,4),rnd(5,8),rnd(2,6)]);while(ds.length<3)ds.push(rnd(1,9));let vals=ds.slice(0,3).map((d,i)=>t+(i===1?d:-d));vals=uniq(vals);while(vals.length<3){let v=t+rnd(-9,9);if(v!==t&&!vals.includes(v))vals.push(v)}return{t,vals:vals.sort(()=>Math.random()-.5)}}
const mids=[[68,23,70,20],[74,18,70,20],[86,29,90,30],[57,19,60,20],[92,31,90,30],[78,26,80,30]];
function makeMid(){let p=mids[rnd(0,mids.length-1)],q=Math.floor(p[2]/p[3]);return{a:p[0],b:p[1],ra:p[2],rb:p[3],ans:q,vals:uniq([Math.max(1,q-1),q,q+2]).sort(()=>Math.random()-.5)}}
const strongs=[[105,25],[93,22],[118,29],[84,19],[127,31],[76,18]];
function makeStrong(){let p=strongs[rnd(0,strongs.length-1)],q=Math.floor(p[0]/p[1]);return{a:p[0],b:p[1],ans:q,rem:p[0]-q*p[1],vals:uniq([Math.max(1,q-1),q,q+1]).sort(()=>Math.random()-.5)}}
function newProblem(){locked=false;hintLevel=0;$("hintbox").classList.remove("show");$("feedback").textContent="数字を見て選んでみよう。困ったらヒント。";character();problem=mode==="weak"?makeWeak():mode==="mid"?makeMid():makeStrong();render()}
function render(){if(mode==="weak"){let p=problem;$("question").textContent="この数字に、いちばん近い攻撃は？";$("equation").innerHTML='<span class="target">'+p.t+'</span> くらい';$("desc").textContent="ぴったりの数字は出ません。距離で考えよう。";$("visual").innerHTML='<div class="numberline"><span class="mark" style="left:50%"><b class="target">'+p.t+'</b></span></div>'}
else if(mode==="mid"){let p=problem;$("question").textContent="商は、だいたいどのくらい？";$("equation").textContent=p.a+" ÷ "+p.b;$("desc").textContent="正確に計算する前に、ざっくり見立てよう。";$("visual").innerHTML='<div style="text-align:center;font-weight:900;padding:19px 0">まずは数字の大きさを眺めよう。</div>'}
else{let p=problem;$("question").textContent=p.b+" は "+p.a+" の中に何個入りそう？";$("equation").textContent=p.a+" ÷ "+p.b+" = ?";$("desc").textContent="入れすぎるとオーバー。";$("visual").innerHTML=bar(p.a,p.b,0)}
$("choices").innerHTML=problem.vals.map(v=>'<button class="choice" data-v="'+v+'">'+v+'<small>'+(mode==="weak"?"こうげき":"個")+'</small></button>').join("");document.querySelectorAll(".choice").forEach(b=>b.onclick=()=>answer(+b.dataset.v,b))}
function bar(total,unit,n){let used=Math.min(total,unit*n),h="";for(let i=0;i<n&&i*unit<total;i++){let w=Math.min(unit,total-i*unit)/total*100;h+='<span class="chunk" style="width:'+w+'%">'+unit+'</span>'}let rest=total-used;if(rest>0)h+='<span class="rest" style="width:'+(rest/total*100)+'%">'+rest+'</span>';return '<div style="font-size:11px;font-weight:900;margin-bottom:4px">'+total+' の中に '+unit+' を並べる</div><div class="meter">'+h+'</div>'}
function answer(v,b){if(locked)return;locked=true;let ok=false,msg="";if(mode==="weak"){let diffs=problem.vals.map(x=>Math.abs(x-problem.t)),best=Math.min(...diffs),d=Math.abs(v-problem.t);ok=d===best;msg=v+" は "+problem.t+" まで "+d+"。"+(ok?" いちばん近い！":" もっと近い数字がある。");$("visual").innerHTML='<div class="numberline">'+problem.vals.concat([problem.t]).map(x=>'<span class="mark" style="left:'+(10+(x-Math.min(...problem.vals,problem.t))/(Math.max(...problem.vals,problem.t)-Math.min(...problem.vals,problem.t))*80)+'%">'+x+'</span>').join("")+'</div>'}
else if(mode==="mid"){ok=v===problem.ans;msg=(ok?"いい見立て！ ":"もう一度、丸めて見ると… ")+problem.ra+" ÷ "+problem.rb+" なら、だいたい "+problem.ans+" 個。";$("visual").innerHTML=bar(problem.ra,problem.rb,v)}
else{ok=v===problem.ans;let prod=v*problem.b;msg=v+"個なら "+problem.b+" × "+v+" = "+prod+"。"+(prod<=problem.a?" 入る！ 残り "+(problem.a-prod)+"。":" "+(prod-problem.a)+" オーバー！");$("visual").innerHTML=bar(problem.a,problem.b,v)}
b.classList.add(ok?"resultGood":"resultBad");$("feedback").innerHTML=(ok?"✓ ":"")+msg;$("char").classList.add("hit");setTimeout(()=>$("char").classList.remove("hit"),400)}
function hint(){hintLevel=Math.min(3,hintLevel+1);$("hintbox").classList.add("show");if(mode==="weak"){let p=problem;if(hintLevel===1)$("hintbox").textContent="ヒント1：左右にどれだけ離れているか見よう。";else if(hintLevel===2)$("hintbox").textContent="ヒント2："+p.vals.map(v=>v+" → あと"+Math.abs(v-p.t)).join(" ／ ");else $("hintbox").textContent="ヒント3：『差』がいちばん小さい数字を選ぼう。"}
else if(mode==="mid"){let p=problem;if(hintLevel===1)$("hintbox").innerHTML="ヒント1：<b>"+p.a+" → "+p.ra+"</b>、<b>"+p.b+" → "+p.rb+"</b> と見てみよう。";else if(hintLevel===2)$("hintbox").innerHTML="ヒント2：<b>"+p.ra+" ÷ "+p.rb+"</b> なら？";else{$("hintbox").innerHTML="ヒント3："+p.rb+" を並べてみると…";$("visual").innerHTML=bar(p.ra,p.rb,p.ans)}}
else{let p=problem;if(hintLevel===1)$("hintbox").textContent="ヒント1："+p.b+"を何回か足して、"+p.a+"を超えないところを探そう。";else if(hintLevel===2)$("hintbox").textContent="ヒント2："+p.b+" × "+Math.max(1,p.ans-1)+" = "+p.b*Math.max(1,p.ans-1)+"。もう1個入りそう？";else{$("hintbox").textContent="ヒント3：ブロックで並べてみよう。";$("visual").innerHTML=bar(p.a,p.b,p.ans)}}}
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{mode=t.dataset.mode;document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",x===t));newProblem()});$("hint").onclick=hint;$("next").onclick=newProblem;newProblem();
</script></body></html>
