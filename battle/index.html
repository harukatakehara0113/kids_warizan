<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#d2d2d2">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="数字の近さ・見立て・商の感覚から筆算の手順まで、日常の困りごととのバトルで身につける算数ゲーム。">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='13' fill='%23d6ff37'/%3E%3Cpath d='M12 35h40M23 17l-9 18 9 12M41 17l9 18-9 12' fill='none' stroke='%23111111' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='32' cy='35' r='6' fill='%233554ff' stroke='%23111111' stroke-width='4'/%3E%3C/svg%3E">
  <title>ギリギリバトル v0.7</title>
  <style>
    :root {
      --ink: #111111;
      --paper: #fffdf5;
      --gray: #c9c9c9;
      --gray-dark: #737373;
      --backdrop: #d2d2d2;
      --main: #3554ff;
      --accent: #d6ff37;
      --event-hint: #ffc928;
      --event-miss: #ff6b5f;
      --event-win: #9462ff;
      --shadow: 5px 5px 0 var(--ink);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body { margin: 0; min-height: 100%; }

    body {
      color: var(--ink);
      font-family: "Hiragino Sans", "Yu Gothic", "Noto Sans JP", system-ui, sans-serif;
      background: var(--backdrop);
      overscroll-behavior-y: none;
    }

    button { font: inherit; color: inherit; }

    button:focus-visible {
      outline: 4px solid var(--paper);
      outline-offset: 3px;
    }

    .app {
      width: min(440px, 100%);
      min-height: 100dvh;
      margin: 0 auto;
      padding: calc(8px + env(safe-area-inset-top)) 10px calc(14px + env(safe-area-inset-bottom));
      position: relative;
      overflow: hidden;
      isolation: isolate;
    }

    .app::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -2;
      pointer-events: none;
      background-image: radial-gradient(var(--ink) 1.5px, transparent 1.5px);
      background-size: 14px 14px;
      opacity: .13;
    }

    .app::after {
      content: "";
      position: absolute;
      width: 230px;
      height: 70px;
      right: -80px;
      top: 92px;
      background: var(--main);
      border: 4px solid var(--ink);
      transform: rotate(14deg);
      z-index: -1;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 7px;
    }

    .brand {
      display: inline-flex;
      align-items: baseline;
      gap: 7px;
      background: var(--paper);
      border: 3px solid var(--ink);
      border-radius: 12px 17px 12px 15px;
      box-shadow: 3px 3px 0 var(--ink);
      padding: 5px 10px 6px;
      transform: rotate(-1.4deg);
    }

    .brand strong { font-size: clamp(21px, 6.2vw, 28px); line-height: 1; letter-spacing: -.08em; }
    .brand small { font-size: 10px; font-weight: 1000; letter-spacing: .04em; }

    .sound {
      min-width: 68px;
      min-height: 38px;
      border: 3px solid var(--ink);
      border-radius: 999px;
      background: var(--accent);
      box-shadow: 3px 3px 0 var(--ink);
      font-size: 12px;
      font-weight: 1000;
      cursor: pointer;
    }

    .modes {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-bottom: 7px;
    }

    .mode-tab {
      min-height: 54px;
      padding: 5px 2px 4px;
      border: 3px solid var(--ink);
      border-radius: 12px;
      background: var(--paper);
      box-shadow: 3px 3px 0 var(--ink);
      cursor: pointer;
      font-weight: 1000;
      line-height: 1.05;
      transition: transform .15s ease, background .15s ease;
    }

    .mode-tab:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
    .mode-tab.on,
    .mode-tab:nth-child(2).on,
    .mode-tab:nth-child(3).on,
    .mode-tab:nth-child(4).on { background: var(--main); color: var(--paper); transform: translateY(-2px) rotate(-1deg); }
    .mode-level { display: block; font-size: 10px; margin-bottom: 3px; }
    .mode-name { display: block; font-size: 14px; }
    .mode-dots { display: flex; justify-content: center; gap: 3px; margin-top: 5px; }
    .mode-dots i { width: 7px; height: 7px; border: 1.5px solid currentColor; border-radius: 50%; background: transparent; }
    .mode-dots i.done { background: currentColor; }

    .arena {
      min-height: 156px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 148px;
      align-items: center;
      gap: 6px;
      border: 4px solid var(--ink);
      border-radius: 22px 14px 22px 15px;
      box-shadow: var(--shadow);
      background: var(--main);
      padding: 9px 8px 7px 11px;
      position: relative;
      transition: background .25s ease;
    }

    .app.event-hint { --event-color: var(--event-hint); }
    .app.event-hit { --event-color: var(--accent); }
    .app.event-miss { --event-color: var(--event-miss); }
    .app.event-win { --event-color: var(--event-win); }
    .app.event-hint .game,
    .app.event-hit .arena,
    .app.event-miss .arena,
    .app.event-win .arena { animation: event-ring .62s ease; }
    .app.event-win .arena { animation-duration: 1s; }

    @keyframes event-ring {
      45% { box-shadow: var(--shadow), 0 0 0 9px var(--event-color); }
    }

    .mission {
      display: inline-block;
      background: var(--ink);
      color: var(--paper);
      border-radius: 999px;
      padding: 4px 9px;
      font-size: 11px;
      font-weight: 1000;
      letter-spacing: .03em;
    }

    .talk {
      position: relative;
      min-height: 62px;
      margin-top: 8px;
      padding: 9px 10px;
      display: flex;
      align-items: center;
      background: var(--paper);
      border: 3px solid var(--ink);
      border-radius: 14px 14px 5px 14px;
      font-size: 14px;
      font-weight: 1000;
      line-height: 1.3;
    }

    .talk::after {
      content: "";
      position: absolute;
      right: -13px;
      bottom: 7px;
      width: 19px;
      height: 19px;
      background: var(--paper);
      border-right: 3px solid var(--ink);
      border-bottom: 3px solid var(--ink);
      transform: rotate(-32deg) skew(-8deg);
    }

    .remaining {
      margin-top: 6px;
      font-size: 12px;
      font-weight: 1000;
    }

    .enemy-wrap { text-align: center; min-width: 0; }
    .character { height: 118px; position: relative; display: grid; place-items: center; }
    .enemy-name { margin-top: -2px; color: var(--paper); font-size: 11px; font-weight: 1000; line-height: 1.15; }

    .enemy {
      width: 138px;
      height: 116px;
      position: relative;
      filter: drop-shadow(3px 4px 0 rgba(17,17,17,.24));
      transform-origin: 50% 80%;
    }

    .enemy .eye {
      position: absolute;
      width: 7px;
      height: 9px;
      border-radius: 50%;
      background: var(--ink);
      z-index: 7;
    }

    .enemy .mouth {
      position: absolute;
      width: 20px;
      height: 9px;
      border-bottom: 4px solid var(--ink);
      border-radius: 50%;
      z-index: 7;
    }

    .enemy.hit { animation: enemy-hit .48s cubic-bezier(.2,.9,.25,1.2); }
    .enemy.miss { animation: enemy-nope .38s ease; }
    .enemy.victory { animation: enemy-defeat .75s ease both; }

    @keyframes enemy-hit {
      20% { transform: translateX(-8px) rotate(-5deg) scale(1.03); }
      45% { transform: translateX(8px) rotate(5deg) scale(.96); }
      70% { transform: translateX(-3px) rotate(-2deg); }
    }

    @keyframes enemy-nope {
      30% { transform: translateY(-4px) rotate(2deg); }
      60% { transform: translateY(2px) rotate(-2deg); }
    }

    @keyframes enemy-defeat {
      45% { transform: translateY(-9px) rotate(-5deg); }
      100% { transform: translateY(3px) rotate(2deg); }
    }

    .shirt-shape {
      position: absolute;
      width: 88px;
      height: 76px;
      left: 25px;
      top: 22px;
      background: var(--ink);
      clip-path: polygon(20% 0, 37% 0, 42% 12%, 58% 12%, 63% 0, 80% 0, 100% 24%, 83% 39%, 76% 31%, 78% 100%, 22% 100%, 24% 31%, 17% 39%, 0 24%);
    }

    .shirt-shape::before {
      content: "";
      position: absolute;
      inset: 4px;
      background: var(--enemy-fill, #a9a9a9);
      clip-path: inherit;
      transition: background .35s ease;
    }

    .enemy-shirt .eye.one { left: 54px; top: 54px; }
    .enemy-shirt .eye.two { right: 53px; top: 54px; }
    .enemy-shirt .mouth { left: 59px; top: 68px; }
    .enemy-shirt.phase-4 .mouth, .enemy-shirt.phase-5 .mouth { border-bottom: 0; border-top: 4px solid var(--ink); top: 74px; }

    .drop {
      --x: 0px;
      --y: 0px;
      position: absolute;
      left: calc(50% + var(--x));
      top: calc(50% + var(--y));
      width: 13px;
      height: 18px;
      background: #efefef;
      border: 3px solid var(--ink);
      border-radius: 60% 60% 60% 20%;
      transform: rotate(45deg);
      z-index: 8;
      transition: transform .35s ease, opacity .35s ease;
    }

    .drop.gone { opacity: 0; transform: translateY(-16px) rotate(90deg) scale(.2); }
    .dry-stamp { position: absolute; inset: 45px 0 auto; z-index: 9; font-size: 14px; font-weight: 1000; transform: rotate(-8deg); }

    .enemy-book .paper {
      position: absolute;
      width: 82px;
      height: 78px;
      left: calc(28px + var(--i) * 2px);
      top: calc(20px - var(--i) * 3px);
      background: #f4f4f4;
      border: 4px solid var(--ink);
      border-radius: 3px;
      transform: rotate(calc((var(--i) - 2) * 2deg));
    }

    .enemy-book .paper::before,
    .enemy-book .paper::after {
      content: "";
      position: absolute;
      left: 13px;
      right: 13px;
      border-top: 3px solid #8d8d8d;
    }

    .enemy-book .paper::before { top: 18px; box-shadow: 0 12px 0 #8d8d8d, 0 24px 0 #8d8d8d; }
    .enemy-book .eye.one { left: 54px; top: 52px; }
    .enemy-book .eye.two { right: 48px; top: 52px; }
    .enemy-book .mouth { left: 62px; top: 67px; }
    .enemy-book.phase-4 .paper { transform: rotate(8deg) translateY(7px); }

    .done-paper {
      position: absolute;
      left: 27px;
      top: 25px;
      width: 86px;
      height: 69px;
      display: grid;
      place-items: center;
      background: #f5f5f5;
      border: 4px solid var(--ink);
      font-size: 28px;
      font-weight: 1000;
      transform: rotate(8deg);
    }

    .tablet-body {
      position: absolute;
      left: 25px;
      top: 16px;
      width: 90px;
      height: 88px;
      border: 5px solid var(--ink);
      border-radius: 13px;
      background: #777;
      box-shadow: inset 0 0 0 6px #bfbfbf;
    }

    .tablet-body::after { content: ""; position: absolute; width: 5px; height: 5px; border-radius: 50%; background: var(--ink); bottom: 3px; left: 38px; }
    .enemy-tablet .eye.one { left: 53px; top: 48px; }
    .enemy-tablet .eye.two { right: 51px; top: 48px; }
    .enemy-tablet .mouth { left: 59px; top: 65px; }

    .lock {
      --angle: 0deg;
      --radius: 48px;
      position: absolute;
      left: 63px;
      top: 55px;
      width: 18px;
      height: 16px;
      border: 3px solid var(--ink);
      background: #f3f3f3;
      transform: rotate(var(--angle)) translateY(calc(-1 * var(--radius))) rotate(calc(-1 * var(--angle)));
      transform-origin: 8px 8px;
      z-index: 9;
      transition: opacity .3s ease, scale .3s ease;
    }

    .lock::before { content: ""; position: absolute; width: 9px; height: 9px; left: 1.5px; top: -10px; border: 3px solid var(--ink); border-bottom: 0; border-radius: 8px 8px 0 0; }
    .unlock { position: absolute; inset: 36px 0 auto; z-index: 10; font-size: 13px; font-weight: 1000; background: var(--paper); border: 3px solid var(--ink); padding: 4px; transform: rotate(-7deg); }

    .register-body {
      position: absolute;
      left: 17px;
      top: 39px;
      width: 108px;
      height: 66px;
      background: #8b8b8b;
      border: 5px solid var(--ink);
      border-radius: 11px 11px 17px 17px;
      transform: skew(-2deg);
    }

    .register-body::before {
      content: "";
      position: absolute;
      left: 12px;
      right: 12px;
      bottom: 8px;
      height: 20px;
      border: 3px solid var(--ink);
      background-image: radial-gradient(var(--ink) 2px, transparent 2.5px);
      background-size: 13px 10px;
      background-color: #d7d7d7;
    }

    .register-screen {
      position: absolute;
      left: 38px;
      top: 48px;
      width: 66px;
      height: 24px;
      display: grid;
      place-items: center;
      color: var(--paper);
      background: #424242;
      border: 3px solid var(--ink);
      font: 1000 10px/1 ui-monospace, monospace;
      z-index: 3;
    }

    .register-receipt {
      position: absolute;
      left: 45px;
      top: 4px;
      width: 52px;
      height: 48px;
      padding-top: 8px;
      background: #f4f4f4;
      border: 4px solid var(--ink);
      border-bottom-style: dashed;
      z-index: 2;
      transform: rotate(-2deg);
    }

    .register-receipt::before { content: ""; display: block; width: 28px; margin: 0 auto; border-top: 3px solid #888; box-shadow: 0 8px 0 #888, 0 16px 0 #888; }
    .enemy-register .eye.one { left: 52px; top: 78px; }
    .enemy-register .eye.two { right: 49px; top: 78px; }
    .enemy-register .mouth { left: 60px; top: 88px; width: 18px; height: 7px; }
    .enemy-register.phase-clear .mouth { border-bottom: 0; border-top: 4px solid var(--ink); top: 94px; }
    .boss-tag { position: absolute; left: 4px; top: 22px; z-index: 7; padding: 2px 5px; color: var(--paper); background: var(--ink); border: 2px solid var(--paper); font-size: 9px; font-weight: 1000; transform: rotate(-9deg); }
    .boss-ticket { position: absolute; left: calc(18px + var(--i) * 36px); top: 6px; z-index: 8; width: 27px; height: 31px; display: grid; place-items: center; background: #f2f2f2; border: 3px solid var(--ink); font-size: 12px; font-weight: 1000; transform: rotate(calc((var(--i) - 1) * 7deg)); transition: opacity .3s ease, transform .3s ease; }
    .boss-ticket.gone { opacity: .15; transform: translateY(-16px) rotate(20deg) scale(.7); }
    .paid-stamp { position: absolute; inset: 51px 8px auto; z-index: 10; padding: 3px; color: var(--ink); background: var(--accent); border: 3px solid var(--ink); font-size: 13px; font-weight: 1000; transform: rotate(-7deg); }

    .game {
      margin-top: 10px;
      padding: 10px;
      background: var(--paper);
      border: 4px solid var(--ink);
      border-radius: 15px 23px 16px 18px;
      box-shadow: var(--shadow);
      position: relative;
    }

    .problem-head { text-align: center; }
    .kicker { display: inline-block; padding: 3px 8px; border: 2px solid var(--ink); border-radius: 999px; background: var(--gray); font-size: 10px; font-weight: 1000; }
    .question { margin-top: 4px; font-size: 15px; font-weight: 1000; line-height: 1.25; }
    .equation { margin: 0; font-size: clamp(29px, 9vw, 39px); font-weight: 1000; line-height: 1.15; letter-spacing: -.04em; }
    .equation .target-num { color: var(--main); text-decoration: underline 5px var(--accent); text-underline-offset: 2px; }
    .equation.rounding { word-spacing: .06em; }
    .ones-muted { opacity: .28; font-weight: 700; transition: opacity .2s ease; }
    .rounded-number { display: inline-block; padding: 0 4px; color: var(--main); text-decoration: underline 5px var(--accent); text-underline-offset: 3px; }
    .equation-stack { display: inline-grid; grid-template-rows: auto auto; place-items: center; margin: 0 2px; vertical-align: middle; line-height: .95; }
    .equation-stack b { min-width: 40px; padding: 2px 5px; color: var(--ink); background: var(--accent); border: 2px solid var(--ink); border-radius: 7px; font-size: .52em; animation: round-drop .28s ease; }
    .equation-stack span { font-size: .82em; }
    @keyframes round-drop { from { opacity: 0; transform: translateY(-8px); } }
    .desc { min-height: 20px; font-size: 12px; font-weight: 800; color: #4f4f4f; }

    .visual {
      min-height: 91px;
      margin: 8px 0;
      padding: 8px;
      background: #eeeeee;
      border: 3px solid var(--ink);
      border-radius: 12px;
      position: relative;
      overflow: hidden;
    }

    .visual::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: linear-gradient(90deg, rgba(17,17,17,.06) 1px, transparent 1px), linear-gradient(rgba(17,17,17,.06) 1px, transparent 1px);
      background-size: 12px 12px;
      pointer-events: none;
    }

    .visual > * { position: relative; z-index: 1; }

    .target-poster { height: 69px; display: grid; place-items: center; }
    .target-poster span { display: inline-block; background: var(--paper); border: 3px solid var(--ink); box-shadow: 4px 4px 0 var(--ink); padding: 5px 15px; font-size: 26px; font-weight: 1000; transform: rotate(-2deg); }
    .target-poster small { display: block; text-align: center; font-size: 10px; font-weight: 1000; margin-top: 5px; }

    .estimate-start { min-height: 69px; display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 1000; }
    .estimate-start b { min-width: 58px; padding: 7px; text-align: center; background: var(--paper); border: 3px solid var(--ink); border-radius: 9px; font-size: 21px; }
    .estimate-start i { font-style: normal; font-size: 24px; }
    .estimate-start small { position: absolute; bottom: 0; font-size: 10px; }

    .round-guide { min-height: 76px; display: grid; place-items: center; text-align: center; }
    .round-progress { margin-bottom: 3px; font-size: 10px; font-weight: 1000; }
    .round-prompt { font-size: 13px; font-weight: 1000; }
    .round-prompt strong { font-size: 25px; }
    .round-options { display: flex; justify-content: center; gap: 9px; margin-top: 7px; }
    .round-option { min-width: 76px; min-height: 43px; border: 3px solid var(--ink); border-radius: 9px; background: var(--paper); box-shadow: 3px 3px 0 var(--ink); font-size: 20px; font-weight: 1000; cursor: pointer; }
    .round-option:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
    .round-option.chosen { background: var(--accent); }
    .round-option.tried { background: #d0d0d0; color: #666; box-shadow: none; transform: translate(3px, 3px); }
    .round-option:disabled { opacity: 1; cursor: default; }
    .round-reveal { min-height: 76px; display: grid; grid-template-rows: auto 11px auto auto; place-items: center; line-height: 1; }
    .round-reveal .rounded { min-width: 58px; padding: 3px 9px; background: var(--accent); border: 3px solid var(--ink); border-radius: 8px; box-shadow: 3px 3px 0 var(--ink); font-size: 24px; font-weight: 1000; animation: round-drop .28s ease; }
    .round-reveal .lift { font-size: 17px; font-weight: 1000; }
    .round-reveal .original { font-size: 22px; font-weight: 1000; }
    .round-reveal small { margin-top: 5px; font-size: 10px; font-weight: 900; }
    .round-summary { min-height: 76px; display: flex; align-items: center; justify-content: center; gap: 13px; }
    .round-summary .pair { display: grid; place-items: center; line-height: 1; }
    .round-summary .pair b { min-width: 60px; padding: 4px 8px; background: var(--accent); border: 3px solid var(--ink); border-radius: 8px; box-shadow: 3px 3px 0 var(--ink); font-size: 22px; }
    .round-summary .pair span { margin-top: 5px; font-size: 15px; font-weight: 1000; }
    .round-summary > b { font-size: 24px; }
    .round-summary-note { text-align: center; font-size: 10px; font-weight: 1000; }

    .digit-scan { min-height: 73px; display: grid; place-items: center; align-content: center; gap: 6px; }
    .scan-caption { font-size: 10px; font-weight: 1000; }
    .digit-row { display: flex; justify-content: center; gap: 4px; }
    .digit-cell { width: 37px; height: 42px; display: grid; place-items: center; background: var(--paper); border: 3px solid var(--ink); border-radius: 7px; font-size: 23px; font-weight: 1000; }
    .scan-rule { padding: 2px 8px; background: var(--gray); border: 2px solid var(--ink); border-radius: 999px; font-size: 10px; font-weight: 1000; }

    .place-guide { min-height: 76px; display: grid; place-items: center; text-align: center; }
    .place-guide strong { font-size: 22px; }
    .place-options { display: flex; justify-content: center; flex-wrap: wrap; gap: 7px; margin-top: 7px; }
    .place-option { min-width: 62px; min-height: 42px; padding: 4px 9px; border: 3px solid var(--ink); border-radius: 9px; background: var(--paper); box-shadow: 3px 3px 0 var(--ink); font-size: 19px; font-weight: 1000; cursor: pointer; }
    .place-option:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
    .place-option.chosen { background: var(--event-hint); }
    .place-option.tried { background: #d0d0d0; color: #666; box-shadow: none; transform: translate(3px, 3px); }
    .place-option:disabled { opacity: 1; cursor: default; }
    .place-reveal { min-height: 76px; display: grid; place-items: center; align-content: center; text-align: center; }
    .place-bracket { position: relative; display: inline-block; min-width: 72px; padding: 8px 13px 4px; border-top: 4px solid var(--event-hint); font-size: 27px; font-weight: 1000; }
    .place-bracket::before, .place-bracket::after { content: ""; position: absolute; top: -4px; width: 4px; height: 11px; background: var(--event-hint); }
    .place-bracket::before { left: 0; }
    .place-bracket::after { right: 0; }

    .app[data-mode="boss"] { width: min(500px, 100%); }

    .long-division {

    .ld-grid { display: grid; gap: 1px; justify-content: center; }

      .mode-level { font-size: 8px; }
      .mode-dots { gap: 2px; }
      .mode-dots i { width: 6px; height: 6px; }
      .multiply-focus { grid-template-columns: 1fr; gap: 4px; }
      .multiply-note { max-width: none; }
    }

    @media (min-width: 700px) {
      .app { padding-top: 18px; padding-bottom: 24px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="app" id="app" data-mode="weak">
    <header class="topbar">
      <div class="brand"><strong>ギリギリバトル</strong><small>v0.7</small></div>
      <button class="sound" id="sound" type="button" aria-pressed="false">音 OFF</button>
    </header>

    <nav class="modes" aria-label="バトルを選ぶ">
      <button class="mode-tab on" type="button" data-mode="weak">
        <span class="mode-level">弱い敵</span><span class="mode-name">近さ</span><span class="mode-dots" aria-hidden="true"></span>
      </button>
      <button class="mode-tab" type="button" data-mode="mid">
        <span class="mode-level">中くらい</span><span class="mode-name">見立て</span><span class="mode-dots" aria-hidden="true"></span>
      </button>
      <button class="mode-tab" type="button" data-mode="strong">
        <span class="mode-level">強い敵</span><span class="mode-name">商を立てる</span><span class="mode-dots" aria-hidden="true"></span>
      </button>
      <button class="mode-tab" type="button" data-mode="boss">
        <span class="mode-level">BOSS</span><span class="mode-name">筆算</span><span class="mode-dots" aria-hidden="true"></span>
      </button>
    </nav>

    <section class="arena" aria-label="敵のようす">
      <div class="enemy-copy">
        <span class="mission" id="badge"></span>
        <div class="talk" id="talk" aria-live="polite"></div>
        <div class="remaining" id="remaining"></div>
      </div>
      <div class="enemy-wrap">
        <div class="character" id="character" aria-hidden="true"></div>
        <div class="enemy-name" id="enemyName"></div>
      </div>
    </section>

    <section class="game" aria-label="数字バトル">
      <div class="round" id="round">
        <div class="problem-head">
          <span class="kicker" id="kicker"></span>
          <div class="question" id="question"></div>
          <p class="equation" id="equation"></p>
          <div class="desc" id="desc"></div>
        </div>
        <div class="visual" id="visual" aria-label="数字の関係を表す図"></div>
        <div class="choices" id="choices" role="group" aria-label="答えを選ぶ"></div>
        <div class="hintbox" id="hintbox" aria-live="polite"></div>
        <div class="feedback" id="feedback" aria-live="polite"></div>
        <div class="actions">
          <button class="action" id="hint" type="button">ヒント 0/3</button>
          <button class="action primary" id="next" type="button" disabled>数字をえらぼう</button>
        </div>
      </div>

      <div class="finish" id="finish" hidden>
        <div class="finish-stamp" id="finishStamp">やっつけた。</div>
        <h2 id="finishTitle"></h2>
        <p id="finishText"></p>
        <div class="actions">
          <button class="action" id="replay" type="button">もう一回</button>
          <button class="action" id="nextEnemy" type="button">つぎの敵へ</button>
        </div>
      </div>
    </section>

    <p class="tiny-note">まちがえてもHPは減らない。数字の差が見えるだけ。</p>
    <div class="particles" id="particles" aria-hidden="true"></div>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    const rnd = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
    const pick = (items) => items[rnd(0, items.length - 1)];
    const shuffle = (items) => {
      const copy = [...items];
      for (let i = copy.length - 1; i > 0; i -= 1) {
        const j = rnd(0, i);
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    };

    const modeOrder = ["weak", "mid", "strong", "boss"];
    const enemies = {
      weak: {
        name: "まだ湿ってるTシャツ",
        kind: "shirt",
        badge: "近さを感じろ",
        intro: ["乾いてます。<br>気持ちとしては。", "その距離感、<br>信用していい？"],
        hits: ["水分にだけ効いた。", "ちょっと風、強くない？", "乾燥という名の攻撃。", "あと一滴は聞いてない。"],
        misses: ["そこ、わりと遠い。", "数字との距離あるね。", "湿度は変わりません。"],
        win: "敵だったっけ、俺。",
        stamp: "乾いた。",
        finish: "数字どうしの『近い・遠い』を5回見抜いた。ぴったりの答えがなくても、距離で選べている。"
      },
      mid: {
        name: "終わらない宿題プリント",
        kind: "book",
        badge: "ざっくり見立てろ",
        intro: ["だいたいで考える？<br>それ、困るんだけど。", "丸めるの禁止。<br>こっちが困るので。"],
        hits: ["一枚だけだからね。", "見立てからの確認、ずるい。", "また減った。遺憾です。", "終わりが見えてきた。嫌。"],
        misses: ["丸めた数字を見よう。", "その仮の商、雑すぎる。", "まだ一枚も減りません。"],
        win: "……終わった。",
        stamp: "終わった。",
        finish: "『丸めて予想 → 本当の数で確かめる → 大きければ1つ下げる』を5回使った。筆算の仮の商につながる動きだ。"
      },
      strong: {
        name: "親に替えられたパスワード",
        kind: "tablet",
        badge: "商を立てろ",
        intro: ["左から、どこまで見るか。<br>そこからです。", "商を立てても、<br>解除とは別です。"],
        hits: ["ロックが一個だけ弱い。", "かけ算で確認するのやめて。", "残りの鍵、がんばれ。", "まだ親には言ってない。"],
        misses: ["その個数、入ってない。", "オーバーはロックの味方。", "積を見たら分かるかもね。"],
        win: "親には言うけどね。",
        stamp: "解除した。",
        finish: "割られる数を左から見て、割る数が入る最初のまとまりを決め、かけ算で商を確かめる流れを5回使った。"
      },
      boss: {
        name: "1円もまけない割り勘レジ",
        kind: "register",
        badge: "筆算をつなげろ",
        intro: ["1円ずれたので、<br>最初からです。", "途中式も全部、<br>確認します。"],
        hits: ["その一桁は通します。", "まだレシートは続きます。", "途中式まで合ってるの、困る。"],
        misses: ["桁がずれております。", "その商、本当に入ります？", "いったん積を見ましょう。"],
        win: "……割り勘、成立です。",
        stamp: "精算した。",
        finish: "商を立てる場所から、見立て、かけ算、比較、ひき算、次の桁まで、筆算の流れをつないだ。"
      }
    };

    const midProblems = [
      { a: 68, b: 23, ra: 70, rb: 20, estimate: 3 },
      { a: 87, b: 28, ra: 90, rb: 30, estimate: 3 },
      { a: 96, b: 19, ra: 100, rb: 20, estimate: 5 },
      { a: 119, b: 31, ra: 120, rb: 30, estimate: 4 },
      { a: 83, b: 21, ra: 80, rb: 20, estimate: 4 },
      { a: 124, b: 42, ra: 120, rb: 40, estimate: 3 },
      { a: 161, b: 39, ra: 160, rb: 40, estimate: 4 },
      { a: 146, b: 29, ra: 150, rb: 30, estimate: 5 }
    ];

    const strongProblems = [
      [105, 25], [93, 22], [118, 29], [84, 19], [127, 31], [76, 18],
      [96, 24], [132, 26], [143, 35], [108, 21], [92, 27], [174, 28]
    ];

    const bossProblems = [
      { a: 224, b: 28, label: "一撃型", note: "商を1回立てる・くり上がりあり" },
      { a: 672, b: 28, label: "連続型", note: "商を2回立てる" },
      { a: 3528, b: 24, label: "長期戦", note: "4桁を3回に分ける" },
      { a: 2828, b: 28, label: "0の罠", note: "商の途中に0が入る" },
      { a: 2534, b: 32, label: "余り戦", note: "最後に余りが残る" }
    ];

    const state = Object.fromEntries(modeOrder.map((key) => [key, { progress: 0, defeated: false }]));
    let mode = "weak";
    let problem = null;
    let hintLevel = 0;
    let solved = false;
    let attempted = new Set();
    let soundOn = false;
    let lastMidIndex = -1;
    let lastStrongIndex = -1;
    let lastBossIndex = -1;
    let roundingGuide = null;
    let placeGuide = null;
    let bossRun = null;
    let bossAutoTimer = null;
    let eventTimer = null;

    function makeWeak() {
      const target = rnd(18, 82);
      const distances = [rnd(1, 2), rnd(3, 5), rnd(7, 10)];
      const signs = shuffle([-1, 1, Math.random() < .5 ? -1 : 1]);
      const values = shuffle(distances.map((distance, index) => target + distance * signs[index]));
      const bestDistance = Math.min(...values.map((value) => Math.abs(value - target)));
      return { target, values, answer: values.find((value) => Math.abs(value - target) === bestDistance) };
    }

    function nextFrom(items, previousIndex) {
      let index = rnd(0, items.length - 1);
      if (items.length > 1 && index === previousIndex) index = (index + 1) % items.length;
      return index;
    }

    function makeMid() {
      lastMidIndex = nextFrom(midProblems, lastMidIndex);
      const base = midProblems[lastMidIndex];
      const final = Math.floor(base.a / base.b);
      return { ...base, final, values: shuffle([base.estimate - 1, base.estimate, base.estimate + 1]) };
    }

    function makeStrong() {
      lastStrongIndex = nextFrom(strongProblems, lastStrongIndex);
      const [a, b] = strongProblems[lastStrongIndex];
      const answer = Math.floor(a / b);
      const prefixes = String(a).split("").map((_, index, digits) => Number(digits.slice(0, index + 1).join("")));
      const partialIndex = prefixes.findIndex((value) => value >= b);
      const partial = prefixes[partialIndex];
      return { a, b, answer, remainder: a - b * answer, values: shuffle([answer - 1, answer, answer + 1]), prefixes, partialIndex, partial };
    }

    function nearestTen(value) {
      return Math.round(value / 10) * 10;
    }

    function buildDivisionSteps(a, b) {
      const digits = String(a).split("").map(Number);
      const steps = [];
      let current = 0;
      let started = false;
      let startIndex = 0;

      digits.forEach((digit, digitIndex) => {
        current = current * 10 + digit;
        if (!started && current < b) return;
        if (!started) {
          started = true;
          startIndex = digitIndex;
        }

        const quotientDigit = Math.floor(current / b);
        const product = quotientDigit * b;
        const remainder = current - product;
        const roundedDividend = nearestTen(current);
        const roundedDivisor = Math.max(10, nearestTen(b));
        const estimate = Math.min(9, Math.floor(roundedDividend / roundedDivisor));
        steps.push({
          digitIndex,
          partial: current,
          quotientDigit,
          product,
          remainder,
          roundedDividend,
          roundedDivisor,
          estimate,
          nextDigit: digits[digitIndex + 1] ?? null
        });
        current = remainder;
      });

      return {
        digits,
        steps,
        startIndex,
        quotient: Math.floor(a / b),
        remainder: a % b
      };
    }

    function makeBoss() {
      lastBossIndex = (lastBossIndex + 1) % bossProblems.length;
      const spec = bossProblems[lastBossIndex];
      const division = buildDivisionSteps(spec.a, spec.b);
      bossRun = {
        ...division,
        ...spec,
        stepIndex: 0,
        phase: "place",
        phaseReady: false,
        phaseAnswer: null,
        phaseAttempts: new Set(),
        attemptedQs: new Set(),
        candidate: null,
        candidateVerified: false,
        retryReason: "",
        subtraction: null,
        history: [],
        completedDigits: {},
        feedback: "商を立てる場所から始めよう。",
        feedbackKind: ""
      };
      state.boss = { progress: 0, defeated: false };
      return bossRun;
    }

    function makeProblem() {
      if (mode === "weak") return makeWeak();
      if (mode === "mid") return makeMid();
      if (mode === "strong") return makeStrong();
      return makeBoss();
    }

    function say(message) { $("talk").innerHTML = message; }

    function modeGoal(key) {
      if (key === "boss") return bossRun ? bossRun.steps.length : 1;
      return 5;
    }

    function renderModeTabs() {
      document.querySelectorAll(".mode-tab").forEach((tab) => {
        const key = tab.dataset.mode;
        const selected = key === mode;
        const goal = modeGoal(key);
        tab.classList.toggle("on", selected);
        tab.setAttribute("aria-current", selected ? "true" : "false");
        tab.setAttribute("aria-label", `${tab.querySelector(".mode-level").textContent} ${tab.querySelector(".mode-name").textContent} ${state[key].progress}/${goal}`);
        tab.querySelector(".mode-dots").innerHTML = Array.from({ length: goal }, (_, index) => `<i class="${index < state[key].progress ? "done" : ""}"></i>`).join("");
      });
    }

    function shirtCharacter(progress) {
      const fillSteps = ["#8b8b8b", "#9f9f9f", "#b4b4b4", "#c9c9c9", "#dedede", "#f1f1f1"];
      const positions = [[-48, -35], [32, -30], [-37, 8], [24, 15], [-4, 34]];
      const drops = positions.map(([x, y], index) => `<i class="drop ${index < progress ? "gone" : ""}" style="--x:${x}px;--y:${y}px"></i>`).join("");
      return `<div class="enemy enemy-shirt phase-${progress}" style="--enemy-fill:${fillSteps[progress]}"><div class="shirt-shape"></div><i class="eye one"></i><i class="eye two"></i><i class="mouth"></i>${drops}${progress === 5 ? '<span class="dry-stamp">DRY.</span>' : ""}</div>`;
    }

    function bookCharacter(progress) {
      const remaining = 5 - progress;
      if (remaining === 0) return '<div class="enemy enemy-book phase-5"><div class="done-paper">済</div></div>';
      const papers = Array.from({ length: remaining }, (_, index) => `<i class="paper" style="--i:${index}"></i>`).join("");
      return `<div class="enemy enemy-book phase-${progress}">${papers}<i class="eye one"></i><i class="eye two"></i><i class="mouth"></i></div>`;
    }

    function tabletCharacter(progress) {
      const locks = Array.from({ length: 5 }, (_, index) => {
        if (index < progress) return "";
        return `<i class="lock" style="--angle:${index * 72}deg"></i>`;
      }).join("");
      return `<div class="enemy enemy-tablet phase-${progress}"><div class="tablet-body"></div><i class="eye one"></i><i class="eye two"></i><i class="mouth"></i>${locks}${progress === 5 ? '<span class="unlock">UNLOCKED</span>' : ""}</div>`;
    }

    function registerCharacter(progress) {
      const goal = modeGoal("boss");
      const tickets = Array.from({ length: goal }, (_, index) => `<i class="boss-ticket ${index < progress ? "gone" : ""}" style="--i:${index}">${index < progress ? "✓" : "?"}</i>`).join("");
      const clear = progress >= goal;
      const screen = clear && bossRun ? `${bossRun.quotient}${bossRun.remainder ? `…${bossRun.remainder}` : ""}` : `${progress}/${goal}`;
      return `<div class="enemy enemy-register ${clear ? "phase-clear" : `phase-${progress}`}"><div class="register-receipt"></div><div class="register-body"></div><div class="register-screen">${screen}</div><i class="eye one"></i><i class="eye two"></i><i class="mouth"></i><span class="boss-tag">BOSS</span>${tickets}${clear ? '<span class="paid-stamp">PAID.</span>' : ""}</div>`;
    }

    function renderEnemy(animation = "") {
      const info = enemies[mode];
      const progress = state[mode].progress;
      const goal = modeGoal(mode);
      $("badge").textContent = info.badge;
      $("enemyName").textContent = info.name;
      $("character").innerHTML = info.kind === "shirt"
        ? shirtCharacter(progress)
        : info.kind === "book"
          ? bookCharacter(progress)
          : info.kind === "tablet"
            ? tabletCharacter(progress)
            : registerCharacter(progress);
      const enemy = $("character").firstElementChild;
      if (animation && enemy) {
        requestAnimationFrame(() => enemy.classList.add(animation));
      }
      const left = goal - progress;
      if (mode === "boss") {
        $("remaining").textContent = left > 0 ? `あと ${left} 桁で精算` : `${goal}桁ぶんの筆算がつながった。`;
      } else {
        $("remaining").textContent = left > 0 ? `あと ${left} 回でやっつける` : "5回成功。もう言い訳できない。";
      }
      renderModeTabs();
    }

    function targetStart(target) {
      return `<div class="target-poster"><div><span>${target} くらい</span><small>ぴったりの ${target} は選択肢にいない</small></div></div>`;
    }

    function muteOnes(value) {
      const digits = String(value);
      return `${digits.slice(0, -1)}<span class="ones-muted">${digits.slice(-1)}</span>`;
    }

    function eventPulse(kind) {
      const app = $("app");
      ["hint", "hit", "miss", "win"].forEach((name) => app.classList.remove(`event-${name}`));
      app.classList.add(`event-${kind}`);
      if (eventTimer) window.clearTimeout(eventTimer);
      eventTimer = window.setTimeout(() => app.classList.remove(`event-${kind}`), kind === "win" ? 1050 : 680);
    }

    function roundingItem(value, rounded) {
      const lower = Math.floor(value / 10) * 10;
      const upper = lower + 10;
      return { value, rounded, lower, upper, tie: value % 10 === 5 };
    }

    function roundEquationPart(item, result) {
      if (!result) return muteOnes(item.value);
      return `<span class="equation-stack"><b>${result.rounded}</b><span>${muteOnes(item.value)}</span></span>`;
    }

    function updateRoundingEquation() {
      if (!roundingGuide) return;
      $("equation").classList.add("rounding");
      $("equation").innerHTML = `${roundEquationPart(roundingGuide.items[0], roundingGuide.results[0])} ÷ ${roundEquationPart(roundingGuide.items[1], roundingGuide.results[1])}`;
    }

    function renderRoundingQuestion() {
      if (!roundingGuide) return;
      const item = roundingGuide.items[roundingGuide.index];
      const wording = item.tie ? "ちょうど真ん中。四捨五入ではどっち？" : "どちらの10に近い？";
      $("visual").innerHTML = `<div class="round-guide"><div><div class="round-progress">概数づくり ${roundingGuide.index + 1}/2</div><div class="round-prompt"><strong>${item.value}</strong> は、${wording}</div><div class="round-options"><button class="round-option" type="button" data-rounded="${item.lower}">${item.lower}</button><button class="round-option" type="button" data-rounded="${item.upper}">${item.upper}</button></div></div></div>`;
      document.querySelectorAll(".round-option").forEach((button) => button.addEventListener("click", () => chooseRoundedNumber(Number(button.dataset.rounded), button)));
    }

    function renderRoundingReveal(item) {
      const distance = Math.abs(item.value - item.rounded);
      const note = item.tie ? "ちょうど真ん中なので、大きい方へ" : `${item.rounded}まで ${distance}`;
      $("visual").innerHTML = `<div class="round-reveal"><span class="rounded">${item.rounded}</span><span class="lift">↑</span><span class="original">${muteOnes(item.value)}</span><small>${note}</small></div>`;
    }

    function finishRoundingGuide(guide) {
      if (roundingGuide !== guide || mode !== "mid" || solved) return;
      const [first, second] = guide.results;
      $("visual").innerHTML = `<div class="round-summary"><span class="pair"><b>${first.rounded}</b><span>${muteOnes(first.value)}</span></span><b>÷</b><span class="pair"><b>${second.rounded}</b><span>${muteOnes(second.value)}</span></span></div><div class="round-summary-note">上の概数で、商を見立てる</div>`;
      $("hintbox").innerHTML = `2つの概数ができた。<strong>${first.rounded}÷${second.rounded}</strong> は、だいたい何個？`;
      $("hint").disabled = false;
      setChoicesLocked(false);
      eventPulse("hint");
    }

    function chooseRoundedNumber(chosen, button) {
      if (!roundingGuide || button.disabled) return;
      const guide = roundingGuide;
      const item = guide.items[guide.index];
      if (chosen === item.rounded) {
        document.querySelectorAll(".round-option").forEach((option) => { option.disabled = true; });
        button.classList.add("chosen");
        guide.results[guide.index] = item;
        updateRoundingEquation();
        renderRoundingReveal(item);
        $("hintbox").innerHTML = item.tie
          ? `<strong>${item.value}</strong>はちょうど真ん中。四捨五入では<strong>${item.rounded}</strong>にする。`
          : `<strong>${item.value}</strong>は、${item.rounded}まで${Math.abs(item.value - item.rounded)}。こちらが近い。`;
        eventPulse("hint");
        window.setTimeout(() => {
          if (roundingGuide !== guide || mode !== "mid" || solved) return;
          guide.index += 1;
          if (guide.index < guide.items.length) renderRoundingQuestion();
          else finishRoundingGuide(guide);
        }, 720);
      } else {
        const chosenDistance = Math.abs(item.value - chosen);
        const correctDistance = Math.abs(item.value - item.rounded);
        button.disabled = true;
        button.classList.add("tried");
        $("hintbox").innerHTML = `<strong>${chosen}</strong>までは${chosenDistance}。<strong>${item.rounded}</strong>までは${correctDistance}。距離をくらべて、もう一度。`;
        eventPulse("miss");
      }
    }

    function startRoundingGuide() {
      roundingGuide = {
        index: 0,
        items: [roundingItem(problem.a, problem.ra), roundingItem(problem.b, problem.rb)],
        results: []
      };
      $("equation").classList.add("rounding");
      updateRoundingEquation();
      $("desc").textContent = "まず、それぞれに近い10を選ぶ。";
      $("hintbox").innerHTML = "ヒント1：<strong>近い方の10</strong>を選んで、概数をつくろう。";
      $("hint").disabled = true;
      setChoicesLocked(true);
      renderRoundingQuestion();
      eventPulse("hint");
    }

    function strongStartVisual(p) {
      const digits = String(p.a).split("").map((digit) => `<span class="digit-cell">${digit}</span>`).join("");
      return `<div class="digit-scan"><div class="scan-caption">左から、見る範囲を広げる</div><div class="digit-row">${digits}</div><span class="scan-rule">${p.b} 以上になる所を探す</span></div>`;
    }

    function renderPlaceQuestion() {
      if (!placeGuide) return;
      const options = problem.prefixes.map((value, index) => `<button class="place-option" type="button" data-prefix-index="${index}">${value}</button>`).join("");
      $("visual").innerHTML = `<div class="place-guide"><div><div class="round-progress">見る範囲を決める</div><div><strong>${problem.b}</strong> が入る最初のまとまりは？</div><div class="place-options">${options}</div></div></div>`;
      document.querySelectorAll(".place-option").forEach((button) => button.addEventListener("click", () => choosePartialDividend(Number(button.dataset.prefixIndex), button)));
    }

    function choosePartialDividend(index, button) {
      if (!placeGuide || button.disabled) return;
      const guide = placeGuide;
      const value = problem.prefixes[index];
      if (index === problem.partialIndex) {
        document.querySelectorAll(".place-option").forEach((option) => { option.disabled = true; });
        button.classList.add("chosen");
        guide.complete = true;
        $("visual").innerHTML = `<div class="place-reveal"><span class="place-bracket">${problem.partial}</span><small>${problem.b}以上になる最初のまとまり</small></div>`;
        $("hintbox").innerHTML = `<strong>${problem.partial}</strong>なら${problem.b}が入る。ここに最初の商を立てる。`;
        $("desc").textContent = `${problem.partial}の中に${problem.b}が何個入るか考える。`;
        eventPulse("hint");
        window.setTimeout(() => {
          if (placeGuide !== guide || mode !== "strong" || solved) return;
          $("hint").disabled = false;
          setChoicesLocked(false);
        }, 720);
      } else {
        button.disabled = true;
        button.classList.add("tried");
        if (index < problem.partialIndex) {
          $("hintbox").innerHTML = `<strong>${value}</strong>は${problem.b}より小さい。もう1桁まで見ると？`;
        } else {
          $("hintbox").innerHTML = `そこまで広げなくても、<strong>${problem.partial}</strong>で${problem.b}が入る。`;
        }
        eventPulse("miss");
      }
    }

    function startPlaceGuide() {
      placeGuide = { complete: false };
      $("desc").textContent = "左から、割る数が入る最初のまとまりを探す。";
      $("hintbox").innerHTML = "ヒント1：<strong>見る範囲</strong>を左から少しずつ広げよう。";
      $("hint").disabled = true;
      setChoicesLocked(true);
      renderPlaceQuestion();
      eventPulse("hint");
    }

    function productChoicesVisual(p) {
      const sorted = [...p.values].sort((a, b) => a - b);
      const cards = sorted.map((value) => {
        const product = p.b * value;
        return `<span class="product-card ${product > p.partial ? "over" : ""}">${p.b} × ${value}<b>${product}</b></span>`;
      }).join("");
      return `<div class="product-grid">${cards}</div><div class="product-note">${p.partial}をこえない最大の積はどれ？</div>`;
    }

    function numberLine(target, values, selected) {
      const all = [...values, target];
      const min = Math.min(...all) - 2;
      const max = Math.max(...all) + 2;
      const left = (value) => 5 + ((value - min) / (max - min)) * 90;
      const marks = values.map((value) => `<span class="nmark ${value === selected ? "selected" : ""}" style="left:${left(value)}%">${value}</span>`).join("");
      const distance = Math.abs(selected - target);
      const direction = selected < target ? `${distance} 足りない` : `${distance} 大きい`;
      return `<div class="numberline">${marks}<span class="nmark target" style="left:${left(target)}%">${target}</span></div><div class="distance-note">${selected} は ${target} より ${direction}</div>`;
    }

    function quantityVisual(total, unit, count, caption = "") {
      const used = unit * count;
      const scale = Math.max(total, used, unit);
      const targetPercent = (total / scale) * 100;
      const blocks = Array.from({ length: count }, (_, index) => {
        const left = (index * unit / scale) * 100;
        const width = (unit / scale) * 100;
        const overflow = (index + 1) * unit > total;
        return `<span class="q-block ${overflow ? "overflow" : ""}" style="left:${left}%;width:${width}%">${unit}</span>`;
      }).join("");
      const relation = count === 0 ? `${unit} が何個入る？` : `${unit} × ${count} = ${used}`;
      return `<div class="q-caption">${caption || relation}</div><div class="q-track"><span class="capacity" style="width:${targetPercent}%"></span>${blocks}<i class="limit-label" style="left:${targetPercent}%">${total}</i></div><span class="unit-chip">1個 = ${unit}</span>`;
    }

    function midCheckVisual(p, selected) {
      const actualProduct = p.b * selected;
      const isEstimate = selected === p.estimate;
      const adjusted = p.estimate > p.final;
      let last = `${p.b} × ${selected} = ${actualProduct}`;
      if (isEstimate) last += adjusted ? `<br>${actualProduct - p.a}こえた → ${p.final} に直す` : `<br>${p.a - actualProduct}余る → そのまま`;
      return `<div class="mid-steps"><div class="mid-step">丸める<b>${p.ra} ÷ ${p.rb}</b></div><div class="mid-arrow">→</div><div class="mid-step">仮の商<b>${selected}</b></div></div><div class="adjust">本当の数で確認：${last}</div>`;
    }

    const bossPhaseLabels = ["桁", "見立て", "かける", "ひく・くらべる", "おろす"];

    function bossStep() {
      return bossRun.steps[bossRun.stepIndex];
    }

    function placeName(index, length, short = false) {
      const power = length - 1 - index;
      const names = short ? ["一", "十", "百", "千", "万"] : ["一の位", "十の位", "百の位", "千の位", "一万の位"];
      return names[power] || `10の${power}乗の位`;
    }

    function bossPhaseNumber(phase) {
      if (phase === "place") return 0;
      if (phase === "estimate") return 1;
      if (phase === "multiply-ones" || phase === "multiply-tens") return 2;
      if (phase === "subtract" || phase === "compare") return 3;
      return 4;
    }

    function bossStepsVisual() {
      const current = bossRun.phase === "done" ? bossPhaseLabels.length : bossPhaseNumber(bossRun.phase);
      return `<div class="boss-steps">${bossPhaseLabels.map((label, index) => `<span class="boss-step ${index < current ? "done" : ""} ${index === current ? "now" : ""}">${index + 1}<br>${label}</span>`).join("")}</div>`;
    }

    function alignedDigits(value, endIndex) {
      const map = {};
      const digits = String(value).split("");
      const start = endIndex - digits.length + 1;
      digits.forEach((digit, index) => { map[start + index] = digit; });
      return map;
    }

    function mergeClasses(target, index, className) {
      target[index] = [target[index], className].filter(Boolean).join(" ");
    }

    function renderLongCells(count, values = {}, classes = {}, annotations = {}, carries = {}, arrows = {}) {
      return Array.from({ length: count }, (_, index) => {
        const hasValue = Object.prototype.hasOwnProperty.call(values, index);
        const value = hasValue ? values[index] : "";
        const annotated = Object.prototype.hasOwnProperty.call(annotations, index);
        const content = annotated
          ? `<span class="ld-old">${value}</span><span class="ld-borrow-value">${annotations[index]}</span>`
          : value;
        const carry = Object.prototype.hasOwnProperty.call(carries, index)
          ? `<span class="ld-carry-note ${carries[index].spent ? "spent" : ""}">${carries[index].value}</span>`
          : "";
        const arrow = Object.prototype.hasOwnProperty.call(arrows, index)
          ? `<span class="ld-down-arrow">↓${arrows[index]}</span>`
          : "";
        return `<span class="ld-cell ${hasValue ? "" : "empty"} ${annotated ? "ld-borrowed" : ""} ${classes[index] || ""}">${content}${carry}${arrow}</span>`;
      }).join("");
    }

    function buildSubtractionPlan(top, bottom) {
      const width = Math.max(String(top).length, String(bottom).length);
      const topDigits = String(top).padStart(width, "0").split("").map(Number);
      const bottomDigits = String(bottom).padStart(width, "0").split("").map(Number);
      const working = [...topDigits];
      const steps = [];

      for (let column = width - 1; column >= 0; column -= 1) {
        const changes = [];
        let borrowed = false;
        if (working[column] < bottomDigits[column]) {
          let lender = column - 1;
          while (lender >= 0 && working[lender] === 0) lender -= 1;
          if (lender >= 0) {
            borrowed = true;
            working[lender] -= 1;
            changes.push({ column: lender, value: working[lender] });
            for (let index = lender + 1; index < column; index += 1) {
              working[index] += 9;
              changes.push({ column: index, value: working[index] });
            }
            working[column] += 10;
            changes.push({ column, value: working[column] });
          }
        }
        steps.push({
          column,
          borrowed,
          changes,
          minuend: working[column],
          subtrahend: bottomDigits[column],
          result: working[column] - bottomDigits[column]
        });
      }

      return {
        width,
        topDigits,
        bottomDigits,
        steps,
        index: 0,
        action: steps[0].borrowed ? "borrow" : "digit",
        results: Array(width).fill(null)
      };
    }

    function subtractionAnnotations() {
      const annotations = {};
      const subtraction = bossRun.subtraction;
      if (!subtraction || (bossRun.phase !== "subtract" && bossRun.phase !== "compare")) return annotations;
      const includeCurrent = subtraction.action === "digit" || bossRun.phaseReady;
      const limit = subtraction.index - (includeCurrent ? 0 : 1);
      subtraction.steps.forEach((item, index) => {
        if (index > limit) return;
        item.changes.forEach((change) => { annotations[change.column] = change.value; });
      });
      return annotations;
    }

    function subtractionPlaceName(column, width) {
      return placeName(column, width);
    }

    function longDivisionNow() {
      const step = bossStep();
      const q = bossRun.candidate;
      if (bossRun.phase === "place") return `いま：<strong>${bossRun.b}が入る最初のまとまり</strong>を左から探す`;
      if (bossRun.phase === "estimate") return `いま：<span class="ld-chip main">${step.partial}</span>を<span class="ld-chip accent">${bossRun.b}</span>でわる見当をつける`;
      if (bossRun.phase === "multiply-ones") return `いま：商<span class="ld-chip main">${q}</span> × 一の位<span class="ld-chip accent">${bossRun.b % 10}</span>`;
      if (bossRun.phase === "multiply-tens") {
        const carry = Math.floor(((bossRun.b % 10) * q) / 10);
        return `いま：商<span class="ld-chip main">${q}</span> × 十の位<span class="ld-chip accent">${Math.floor(bossRun.b / 10)}</span> ＋ <span class="ld-chip carry">${carry}</span>`;
      }
      if (bossRun.phase === "compare") {
        const product = bossRun.b * q;
        if (product > step.partial) return `いま：上の<span class="ld-chip main">${step.partial}</span>より積<span class="ld-chip accent">${product}</span>が大きくない？`;
        return `いま：引いた余り<span class="ld-chip main">${step.partial - product}</span>に<span class="ld-chip accent">${bossRun.b}</span>があと1つ入る？`;
      }
      if (bossRun.phase === "subtract" && bossRun.subtraction) {
        const current = bossRun.subtraction.steps[bossRun.subtraction.index];
        if (bossRun.subtraction.action === "borrow") return `いま：<span class="ld-chip main">${current.minuend - 10}</span>から<span class="ld-chip accent">${current.subtrahend}</span>は引けない → 左から1をかりる`;
        return `いま：上の<span class="ld-chip main">${current.minuend}</span> − 下の<span class="ld-chip accent">${current.subtrahend}</span>`;
      }
      if (bossRun.phase === "bring") return `いま：余り<span class="ld-chip main">${step.remainder}</span>の右へ<span class="ld-chip accent">${step.nextDigit}</span>をおろす`;
      return `完成：<strong>${bossRun.a} ÷ ${bossRun.b} = ${bossRun.quotient}</strong>`;
    }

    function bossDivisionBoard(interactivePlace = false) {
      const step = bossStep();
      const count = bossRun.digits.length;
      const currentQ = bossRun.candidate;
      const qCells = bossRun.digits.map((_, index) => {
        const fixed = bossRun.completedDigits[index];
        const isCurrent = index === step.digitIndex;
        const trial = isCurrent && currentQ !== null && bossRun.phase !== "place";
        const value = fixed !== undefined ? fixed : trial ? currentQ : isCurrent && bossRun.phaseReady && bossRun.phase === "place" ? "?" : "";
        const activeMultiply = isCurrent && (bossRun.phase === "multiply-ones" || bossRun.phase === "multiply-tens");
        const classes = ["ld-cell", "quotient", fixed !== undefined ? "fixed" : "", trial ? "trial" : "", activeMultiply ? "use-main" : "", bossRun.phase === "place" && bossRun.phaseAttempts.has(index) ? "tried" : ""].filter(Boolean).join(" ");
        if (interactivePlace) {
          return `<button class="${classes}" type="button" data-place="${index}" ${bossRun.phaseReady ? "disabled" : ""} aria-label="${placeName(index, count)}に商を立てる"><span>?</span><small>${placeName(index, count, true)}の位</small></button>`;
        }
        return `<span class="${classes} ${value === "" ? "empty" : ""}">${value}</span>`;
      }).join("");

      const sourceClasses = {};
      const sourceAnnotations = {};
      const sourceStart = step.digitIndex - String(step.partial).length + 1;
      const sourceIndices = Object.keys(alignedDigits(step.partial, step.digitIndex)).map(Number);
      if (bossRun.phase === "place") {
        for (let index = 0; index <= step.digitIndex; index += 1) mergeClasses(sourceClasses, index, "use-main");
      }
      if (bossRun.phase === "estimate" || (bossRun.phase === "compare" && !bossRun.subtraction)) {
        sourceIndices.forEach((index) => mergeClasses(sourceClasses, index, "use-main"));
      }
      if ((bossRun.phase === "subtract" || bossRun.phase === "compare") && bossRun.subtraction) {
        const annotations = subtractionAnnotations();
        Object.entries(annotations).forEach(([column, value]) => { sourceAnnotations[sourceStart + Number(column)] = value; });
        if (bossRun.phase === "subtract") {
          const current = bossRun.subtraction.steps[bossRun.subtraction.index];
          mergeClasses(sourceClasses, sourceStart + current.column, "use-main");
          if (bossRun.subtraction.action === "borrow") {
            current.changes.forEach((change) => {
              if (change.column !== current.column) mergeClasses(sourceClasses, sourceStart + change.column, "use-carry");
            });
          }
        }
      }

      const divisorDigits = String(bossRun.b).split("");
      const divisorActive = bossRun.phase === "multiply-ones" ? divisorDigits.length - 1 : bossRun.phase === "multiply-tens" ? 0 : -1;
      const compareRemainder = bossRun.phase === "compare" && !!bossRun.subtraction;
      const divisor = `<span class="ld-divisor">${divisorDigits.map((digit, index) => `<i class="ld-divisor-digit ${index === divisorActive || compareRemainder ? "use-accent" : ""}">${digit}</i>`).join("")}</span>`;

      const dividendValues = Object.fromEntries(bossRun.digits.map((digit, index) => [index, digit]));
      const dividendClasses = {};
      bossRun.digits.forEach((_, index) => {
        mergeClasses(dividendClasses, index, `ld-dividend-cell ${index === 0 ? "first" : ""}`);
        if (bossRun.stepIndex === 0 && sourceClasses[index]) mergeClasses(dividendClasses, index, sourceClasses[index]);
        if (bossRun.phase === "bring" && index === step.digitIndex + 1) mergeClasses(dividendClasses, index, "use-accent");
      });
      const dividendAnnotations = bossRun.stepIndex === 0 ? sourceAnnotations : {};

      const rows = [];
      rows.push(`<div class="ld-row"><span class="ld-prefix ld-row-label">商</span>${qCells}</div>`);
      rows.push(`<div class="ld-row">${divisor}${renderLongCells(count, dividendValues, dividendClasses, dividendAnnotations)}</div>`);

      bossRun.history.forEach((item, historyIndex) => {
        const productValues = alignedDigits(item.product, item.digitIndex);
        rows.push(`<div class="ld-row ld-work-row"><span class="ld-prefix minus">−</span>${renderLongCells(count, productValues)}</div>`);
        const ruleClasses = {};
        Object.keys(productValues).forEach((index) => { ruleClasses[index] = "ld-rule-cell"; });
        rows.push(`<div class="ld-row ld-rule-row"><span class="ld-prefix"></span>${renderLongCells(count, {}, ruleClasses)}</div>`);
        const resultEnd = item.nextDigit === null ? item.digitIndex : item.digitIndex + 1;
        const resultValue = item.nextDigit === null ? item.remainder : item.nextPartial;
        const resultValues = alignedDigits(resultValue, resultEnd);
        const resultClasses = {};
        const resultAnnotations = {};
        if (historyIndex === bossRun.stepIndex - 1) {
          Object.entries(sourceClasses).forEach(([index, value]) => { resultClasses[index] = value; });
          Object.entries(sourceAnnotations).forEach(([index, value]) => { resultAnnotations[index] = value; });
        }
        rows.push(`<div class="ld-row ld-work-row"><span class="ld-prefix ld-row-label">${item.nextDigit === null ? "余り" : "おろす"}</span>${renderLongCells(count, resultValues, resultClasses, resultAnnotations)}</div>`);
        rows.push('<div class="ld-step-gap"></div>');
      });

      if (bossRun.phase !== "place" && bossRun.phase !== "estimate" && bossRun.phase !== "done") {
        const product = bossRun.b * currentQ;
        const fullProduct = alignedDigits(product, step.digitIndex);
        const productValues = {};
        const productClasses = {};
        const carries = {};
        const productIndices = Object.keys(fullProduct).map(Number);
        const onesRaw = (bossRun.b % 10) * currentQ;
        const carry = Math.floor(onesRaw / 10);
        const carryIndex = Math.max(0, step.digitIndex - 1);

        if (bossRun.phase === "multiply-ones") {
          productValues[step.digitIndex] = bossRun.phaseReady ? onesRaw % 10 : "?";
          mergeClasses(productClasses, step.digitIndex, bossRun.phaseReady ? "just-written" : "use-accent");
          if (bossRun.phaseReady && carry) carries[carryIndex] = { value: carry, spent: false };
        } else if (bossRun.phase === "multiply-tens") {
          productValues[step.digitIndex] = onesRaw % 10;
          if (carry) carries[carryIndex] = { value: carry, spent: bossRun.phaseReady };
          if (bossRun.phaseReady) {
            Object.assign(productValues, fullProduct);
            productIndices.filter((index) => index !== step.digitIndex).forEach((index) => mergeClasses(productClasses, index, "just-written"));
          } else {
            productIndices.filter((index) => index !== step.digitIndex).forEach((index) => {
              productValues[index] = "?";
              mergeClasses(productClasses, index, "use-accent");
            });
          }
        } else {
          Object.assign(productValues, fullProduct);
          if (carry) carries[carryIndex] = { value: carry, spent: true };
          if (bossRun.phase === "compare" && !bossRun.subtraction) productIndices.forEach((index) => mergeClasses(productClasses, index, "use-accent"));
          if (bossRun.phase === "subtract" && bossRun.subtraction) {
            const current = bossRun.subtraction.steps[bossRun.subtraction.index];
            mergeClasses(productClasses, sourceStart + current.column, "use-accent");
          }
        }

        rows.push(`<div class="ld-row ld-work-row"><span class="ld-prefix minus">−</span>${renderLongCells(count, productValues, productClasses, {}, carries)}</div>`);
        if (bossRun.phase === "compare" || bossRun.phase === "subtract" || bossRun.phase === "bring" || (bossRun.phase === "multiply-tens" && bossRun.phaseReady)) {
          const ruleClasses = {};
          productIndices.forEach((index) => { ruleClasses[index] = "ld-rule-cell"; });
          rows.push(`<div class="ld-row ld-rule-row"><span class="ld-prefix"></span>${renderLongCells(count, {}, ruleClasses)}</div>`);
        }

        if ((bossRun.phase === "subtract" || bossRun.phase === "compare") && bossRun.subtraction) {
          const resultValues = {};
          const resultClasses = {};
          bossRun.subtraction.results.forEach((value, column) => {
            if (value !== null) {
              resultValues[sourceStart + column] = value;
              if (bossRun.phase === "compare") resultClasses[sourceStart + column] = "use-main";
            }
          });
          const current = bossRun.subtraction.steps[bossRun.subtraction.index];
          const currentGlobal = sourceStart + current.column;
          if (bossRun.phase === "subtract" && bossRun.subtraction.action === "digit" && !bossRun.phaseReady) {
            resultValues[currentGlobal] = "?";
            resultClasses[currentGlobal] = "ghost";
          }
          if (bossRun.phase === "subtract" && bossRun.phaseReady && bossRun.subtraction.action === "digit") resultClasses[currentGlobal] = "just-written";
          rows.push(`<div class="ld-row ld-work-row"><span class="ld-prefix ld-row-label">${bossRun.phase === "compare" ? "余り" : "答え"}</span>${renderLongCells(count, resultValues, resultClasses)}</div>`);
        }

        if (bossRun.phase === "bring") {
          const resultEnd = bossRun.phaseReady ? step.digitIndex + 1 : step.digitIndex;
          const resultValue = bossRun.phaseReady ? step.remainder * 10 + step.nextDigit : step.remainder;
          const resultValues = alignedDigits(resultValue, resultEnd);
          const resultClasses = {};
          const arrows = {};
          if (bossRun.phaseReady) mergeClasses(resultClasses, step.digitIndex + 1, "just-written");
          else arrows[step.digitIndex + 1] = step.nextDigit;
          rows.push(`<div class="ld-row ld-work-row"><span class="ld-prefix ld-row-label">おろす</span>${renderLongCells(count, resultValues, resultClasses, {}, {}, arrows)}</div>`);
        }
      }

      return `<div class="long-division"><div class="ld-now">${longDivisionNow()}</div><div class="ld-grid" style="--digit-count:${count}">${rows.join("")}</div></div>`;
    }

    function bossEstimateCandidates(step) {
      const values = [];
      const add = (value) => {
        if (value >= 0 && value <= 9 && !values.includes(value)) values.push(value);
      };
      add(step.estimate);
      add(step.quotientDigit);
      [1, -1, 2, -2, 3, -3].forEach((delta) => {
        add(step.estimate + delta);
        add(step.quotientDigit + delta);
      });
      return values.slice(0, 3).sort((a, b) => a - b);
    }

    function bossNumberChoices(correct, spread = 1) {
      const values = [correct];
      const safeSpread = Math.max(1, spread);
      [safeSpread, -safeSpread, 1, -1, safeSpread * 2, 10, -10].forEach((delta) => {
        const value = correct + delta;
        if (value >= 0 && !values.includes(value) && values.length < 3) values.push(value);
      });
      return values.sort((a, b) => a - b);
    }

    function bossDigitChoices(correct) {
      const values = [correct];
      [1, -1, 2, -2, 3, -3, 4, -4].forEach((delta) => {
        const value = correct + delta;
        if (value >= 0 && value <= 9 && !values.includes(value) && values.length < 3) values.push(value);
      });
      return values.sort((a, b) => a - b);
    }

    function multiplicationPanel(part) {
      const step = bossStep();
      const q = bossRun.candidate;
      const ones = bossRun.b % 10;
      const tens = Math.floor(bossRun.b / 10);
      const onesRaw = ones * q;
      const writtenOne = onesRaw % 10;
      const carry = Math.floor(onesRaw / 10);
      const tensRaw = tens * q + carry;
      const ready = bossRun.phaseReady;

      if (part === "ones") {
        const note = ready
          ? `積の一の位に<strong>${writtenOne}</strong>を書き、${carry ? `<strong>${carry}</strong>を左上へ小さく書く。` : "くり上がりはなし。"}`
          : `黄色の<strong>${ones}</strong>と青い商<strong>${q}</strong>を使う。`;
        return `<div class="boss-panel"><div class="boss-panel-title"><span class="column-name">積の一の位</span></div><div class="column-equation">${ones} × ${q} = ${ready ? onesRaw : "?"}</div><div class="column-note">${note}<br>答えは上の筆算へ書きこまれる。</div></div>`;
      }

      const candidateProduct = bossRun.b * q;
      const note = ready
        ? `<strong>${tensRaw}</strong>を一の位${writtenOne}の左へ書いて、積は<strong>${candidateProduct}</strong>。`
        : `黄色の<strong>${tens}</strong>と青い商<strong>${q}</strong>をかけ、小さな<strong>${carry}</strong>も足す。`;
      return `<div class="boss-panel"><div class="boss-panel-title"><span class="column-name">積の十の位から</span></div><div class="column-equation">${tens} × ${q} ＋ <span class="carry-visual">${carry}</span> = ${ready ? tensRaw : "?"}</div><div class="column-note">${note}<br>上の筆算で、使う数字が光っている。</div></div>`;
    }

    function bossVerdict(step, candidate = bossRun.candidate) {
      const product = bossRun.b * candidate;
      if (product > step.partial) return "over";
      if (product + bossRun.b <= step.partial) return "under";
      return "fit";
    }

    function comparePanel() {
      const step = bossStep();
      const product = bossRun.b * bossRun.candidate;
      if (product > step.partial) {
        return `<div class="boss-panel"><div class="boss-panel-title">引き算の前に、大きさを確認</div><div class="remainder-check"><div class="remainder-equation">${step.partial} − ${product}</div><div class="column-note">下の積が上の数より大きいと、引けない。商を小さくする？</div></div></div>`;
      }
      const remainder = step.partial - product;
      return `<div class="boss-panel"><div class="boss-panel-title">筆算で引いた余りを使う</div><div class="remainder-check"><div class="remainder-equation">${step.partial} − ${product} = ${remainder}</div><div class="remainder-gate"><span class="remainder-value">余り ${remainder}</span><span>の中に</span><span class="remainder-divisor">${bossRun.b}</span><span>が、あと1つ入る？</span></div></div></div>`;
    }

    function bossPanel() {
      const step = bossStep();
      if (bossRun.phase === "place") {
        return `<div class="boss-panel"><div class="boss-panel-title">最初の商はどの桁に立つ？</div><div class="place-callout">左から見て、<b>${bossRun.b}</b> が入る最初のまとまりを探す。<br>上の「？」をタップ。</div></div>`;
      }
      if (bossRun.phase === "estimate") {
        const retry = bossRun.retryReason ? `<div class="boss-panel-title">${bossRun.retryReason} 商を直そう</div>` : `<div class="boss-panel-title">一の位をうすく見て、仮の商を予想</div>`;
        return `<div class="boss-panel">${retry}<div class="boss-estimate"><span class="estimate-pair"><span>${muteOnes(step.partial)}</span><i class="estimate-arrow">↓</i><b>${step.roundedDividend}</b></span><i class="estimate-symbol">÷</i><span class="estimate-pair"><span>${muteOnes(bossRun.b)}</span><i class="estimate-arrow">↓</i><b>${step.roundedDivisor}</b></span></div><div class="estimate-question">${step.roundedDividend}÷${step.roundedDivisor} なら、だいたい何個？</div></div>`;
      }
      if (bossRun.phase === "multiply-ones") return multiplicationPanel("ones");
      if (bossRun.phase === "multiply-tens") return multiplicationPanel("tens");
      if (bossRun.phase === "compare") return comparePanel();
      if (bossRun.phase === "subtract") {
        const subtraction = bossRun.subtraction;
        const current = subtraction.steps[subtraction.index];
        const place = subtractionPlaceName(current.column, subtraction.width);
        if (subtraction.action === "borrow") {
          const original = current.minuend - 10;
          const result = bossRun.phaseReady ? `${original} → ${current.minuend}` : `${original} → ?`;
          return `<div class="boss-panel"><div class="boss-panel-title"><span class="column-name">${place}</span> そのままでは引けない</div><div class="column-equation">${original} − ${current.subtrahend}</div><div class="column-note">左の位から1をかりる：<strong>${result}</strong><br>変わった数字は上の筆算に小さく残る。</div></div>`;
        }
        return `<div class="boss-panel"><div class="boss-panel-title"><span class="column-name">${place}</span> 右から1桁ずつひく</div><div class="column-equation">${current.minuend} − ${current.subtrahend} = ${bossRun.phaseReady ? current.result : "?"}</div><div class="column-note">青い上の数字から、黄色い下の数字をひく。答えは同じ位へ。</div></div>`;
      }
      if (bossRun.phase === "bring") {
        const nextPartial = step.remainder * 10 + step.nextDigit;
        return `<div class="boss-panel"><div class="boss-panel-title">余りの右へ、次の桁をおろす</div><div class="bring-visual"><span>${step.remainder}</span><span>＋</span><span class="bring-digit">↓ ${step.nextDigit}</span><span>→</span><span class="bring-result">${bossRun.phaseReady ? nextPartial : "?"}</span></div></div>`;
      }
      return `<div class="boss-panel"><strong>${bossRun.a} ÷ ${bossRun.b} = ${bossRun.quotient}</strong></div>`;
    }

    function bossChoices() {
      const step = bossStep();
      const button = (value, label = "", action = "number") => {
        const tried = bossRun.phaseAttempts.has(value) || (bossRun.phase === "estimate" && bossRun.attemptedQs.has(Number(value)));
        const good = bossRun.phaseReady && String(bossRun.phaseAnswer) === String(value);
        return `<button class="boss-choice ${tried ? "tried" : ""} ${good ? "good" : ""}" type="button" data-boss-action="${action}" data-value="${value}" ${tried || bossRun.phaseReady ? "disabled" : ""}>${label || value}</button>`;
      };

      if (bossRun.phase === "place") return "";
      if (bossRun.phase === "estimate") return bossEstimateCandidates(step).map((value) => button(value, `${value}<small>仮の商</small>`, "estimate")).join("");
      if (bossRun.phase === "multiply-ones") {
        const correct = (bossRun.b % 10) * bossRun.candidate;
        return bossNumberChoices(correct, Math.max(1, bossRun.candidate)).map((value) => button(value, value, "multiply-ones")).join("");
      }
      if (bossRun.phase === "multiply-tens") {
        const carry = Math.floor(((bossRun.b % 10) * bossRun.candidate) / 10);
        const correct = Math.floor(bossRun.b / 10) * bossRun.candidate + carry;
        return bossNumberChoices(correct, Math.max(1, Math.floor(bossRun.b / 10))).map((value) => button(value, value, "multiply-tens")).join("");
      }
      if (bossRun.phase === "compare") {
        const product = bossRun.b * bossRun.candidate;
        if (product > step.partial) {
          return [button("over", "積が大きい", "verdict"), button("fit", "引けそう", "verdict")].join("");
        }
        return [button("under", "もう1つ入る", "verdict"), button("fit", "もう入らない", "verdict")].join("");
      }
      if (bossRun.phase === "subtract") {
        const subtraction = bossRun.subtraction;
        const current = subtraction.steps[subtraction.index];
        if (subtraction.action === "borrow") {
          return `<button class="boss-choice wide ${bossRun.phaseReady ? "good" : ""}" type="button" data-boss-action="borrow" ${bossRun.phaseReady ? "disabled" : ""}>左の位から 1 をかりる</button>`;
        }
        return bossDigitChoices(current.result).map((value) => button(value, value, "subtract")).join("");
      }
      if (bossRun.phase === "bring") return `<button class="boss-choice wide ${bossRun.phaseReady ? "good" : ""}" type="button" data-boss-action="bring" ${bossRun.phaseReady ? "disabled" : ""}>「${step.nextDigit}」をおろす</button>`;
      return "";
    }

    function bossQuestion() {
      if (bossRun.phase === "subtract" && bossRun.subtraction) {
        const subtraction = bossRun.subtraction;
        const current = subtraction.steps[subtraction.index];
        const place = subtractionPlaceName(current.column, subtraction.width);
        return subtraction.action === "borrow" ? `${place}：引けないときは？` : `${place}を引くと？`;
      }
      if (bossRun.phase === "compare") {
        return bossRun.b * bossRun.candidate > bossStep().partial ? "この積は引ける？" : "余りに、あともう1つ入る？";
      }
      const questions = {
        place: "最初の商を立てる場所は？",
        estimate: bossRun.retryReason ? "仮の商を直そう" : "だいたい何個入りそう？",
        "multiply-ones": "一の位からかけると？",
        "multiply-tens": "十の位と、くり上がりは？",
        bring: "次の桁をおろそう"
      };
      return questions[bossRun.phase] || "筆算がつながった";
    }

    function bossNextLabel() {
      if (!bossRun.phaseReady) return "上の問題を解こう";
      if (bossRun.phase === "place") return "見立てへ";
      if (bossRun.phase === "estimate") return "かけ算で確認";
      if (bossRun.phase === "multiply-ones") return "十の位へ…";
      if (bossRun.phase === "multiply-tens") return bossVerdict(bossStep()) === "over" ? "積の大きさを確認" : "積をひく";
      if (bossRun.phase === "compare") {
        if (!bossRun.candidateVerified) return "商を直す";
        return bossStep().nextDigit === null ? "答えを確定" : "次の桁をおろす";
      }
      if (bossRun.phase === "subtract") {
        const subtraction = bossRun.subtraction;
        if (subtraction.action === "borrow") return "借りた数で計算";
        if (subtraction.index < subtraction.steps.length - 1) return "次の位をひく";
        return "余りをくらべる";
      }
      if (bossRun.phase === "bring") return "次の商へ";
      return "精算完了";
    }

    function attachBossHandlers() {
      document.querySelectorAll("[data-boss-action]").forEach((button) => button.addEventListener("click", () => {
        const action = button.dataset.bossAction;
        const raw = button.dataset.value;
        if (action === "estimate") chooseBossEstimate(Number(raw));
        if (action === "multiply-ones" || action === "multiply-tens") chooseBossCalculation(Number(raw));
        if (action === "verdict") chooseBossVerdict(raw);
        if (action === "borrow") chooseBossBorrow();
        if (action === "subtract") chooseBossSubtraction(Number(raw));
        if (action === "bring") chooseBossBringDown();
      }));
    }

    function renderBossPhase() {
      const step = bossStep();
      $("kicker").textContent = `BOSS・${bossRun.label}　商 ${bossRun.stepIndex + 1}/${bossRun.steps.length}`;
      $("question").textContent = bossQuestion();
      $("equation").className = "equation";
      $("equation").textContent = `${bossRun.a} ÷ ${bossRun.b}`;
      $("desc").textContent = `${bossRun.note}｜いま見る数は ${step.partial}`;
      $("visual").innerHTML = `${bossStepsVisual()}${bossDivisionBoard(bossRun.phase === "place")}${bossPanel()}`;
      $("choices").classList.toggle("two", bossRun.phase === "compare");
      $("choices").innerHTML = bossChoices();
      $("feedback").className = `feedback ${bossRun.feedbackKind}`.trim();
      $("feedback").innerHTML = bossRun.feedback;
      const autoAdvancing = bossRun.phase === "multiply-ones" && bossRun.phaseReady && bossAutoTimer !== null;
      $("next").disabled = !bossRun.phaseReady || autoAdvancing;
      $("next").textContent = bossNextLabel();
      $("hint").disabled = bossRun.phaseReady;
      attachBossHandlers();
      renderModeTabs();
    }

    function setBossFeedback(message, kind = "") {
      bossRun.feedback = message;
      bossRun.feedbackKind = kind;
      renderBossPhase();
    }

    function chooseBossPlace(index) {
      if (bossRun.phase !== "place" || bossRun.phaseReady) return;
      const step = bossStep();
      if (index === step.digitIndex) {
        bossRun.phaseReady = true;
        bossRun.phaseAnswer = index;
        const prefix = Number(bossRun.digits.slice(0, index + 1).join(""));
        setBossFeedback(`<strong>${prefix}</strong>で初めて${bossRun.b}が入る。商は<strong>${placeName(index, bossRun.digits.length)}</strong>から。`, "good");
        eventPulse("hit");
        playTone("hit");
      } else {
        bossRun.phaseAttempts.add(index);
        const prefix = Number(bossRun.digits.slice(0, index + 1).join(""));
        const message = index < step.digitIndex
          ? `<strong>${prefix}</strong>は${bossRun.b}より小さい。もう1桁まで見よう。`
          : `<strong>${step.partial}</strong>でもう${bossRun.b}が入る。商は1つ左の桁から。`;
        setBossFeedback(message, "try");
        eventPulse("miss");
      }
    }

    function chooseBossEstimate(value) {
      if (bossRun.phase !== "estimate" || bossRun.phaseReady || bossRun.attemptedQs.has(value)) return;
      bossRun.candidate = value;
      bossRun.candidateVerified = false;
      bossRun.phaseReady = true;
      bossRun.phaseAnswer = value;
      bossRun.retryReason = "";
      setBossFeedback(`<strong>${value}</strong>個と予想。予想は仮でOK。本当の${bossRun.b}をかけて確かめよう。`);
      eventPulse("hint");
    }

    function chooseBossCalculation(value) {
      const step = bossStep();
      const q = bossRun.candidate;
      const onesRaw = (bossRun.b % 10) * q;
      const carry = Math.floor(onesRaw / 10);
      const correct = bossRun.phase === "multiply-ones" ? onesRaw : Math.floor(bossRun.b / 10) * q + carry;
      if (bossRun.phaseReady || bossRun.phaseAttempts.has(value)) return;
      if (value === correct) {
        const completedPhase = bossRun.phase;
        bossRun.phaseReady = true;
        bossRun.phaseAnswer = value;
        const message = completedPhase === "multiply-ones"
          ? `<strong>${bossRun.b % 10}×${q}=${onesRaw}</strong>。${onesRaw % 10}を書き、${carry}を小さく上へ。`
          : `<strong>${Math.floor(bossRun.b / 10)}×${q}＋${carry}=${correct}</strong>。つなげると積は${bossRun.b * q}。`;
        if (completedPhase === "multiply-ones") {
          if (bossAutoTimer !== null) window.clearTimeout(bossAutoTimer);
          bossAutoTimer = window.setTimeout(() => {
            bossAutoTimer = null;
            if (mode === "boss" && bossRun.phase === "multiply-ones" && bossRun.phaseReady) beginBossPhase("multiply-tens");
          }, 720);
